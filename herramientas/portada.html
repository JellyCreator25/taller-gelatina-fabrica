<!doctype html>
<meta charset="utf-8">
<style>
@@FUENTES@@
*{box-sizing:border-box}
html,body{margin:0;width:630px;height:500px;overflow:hidden}
body{font-family:'Fredoka',system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,@@A@@ 0%,@@B@@ 100%);position:relative}
.glow{position:absolute;right:-90px;top:-110px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.30),rgba(255,255,255,0) 65%)}
h1{position:absolute;left:34px;top:30px;margin:0;max-width:400px;font-size:74px;line-height:.92;font-weight:700;letter-spacing:-.5px;text-shadow:0 4px 0 rgba(0,0,0,.22),0 10px 24px rgba(0,0,0,.25)}
.lema{position:absolute;left:36px;top:186px;margin:0;font-size:25px;font-weight:600;max-width:300px;line-height:1.12;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.shot{position:absolute;right:-34px;bottom:-30px;width:420px;border-radius:22px;border:6px solid #fff;box-shadow:0 18px 40px rgba(0,0,0,.35);transform:rotate(-4deg);overflow:hidden;background:#fff}
.shot img{display:block;width:100%}
.shot.vertical{right:44px;bottom:-84px;width:232px;transform:rotate(3deg)}
.sello{position:absolute;left:36px;bottom:30px;font:700 15px 'Nunito Sans',system-ui,sans-serif;background:rgba(0,0,0,.28);padding:7px 13px;border-radius:999px}
</style>
<div class="glow"></div>
<h1>@@TITULO@@</h1>
<p class="lema">@@LEMA@@</p>
<div class="shot @@CLASE@@"><img src="@@IMG@@" alt=""></div>
<div class="sello">@@SELLO@@</div>
