name: Ciclo semanal
# El latido de la fábrica: importa las métricas (si hay token de solo lectura), reconstruye, revisa, genera el sitio y deja publicacion/PENDIENTE.md
# con lo que está listo para aprobar y la recomendación de rumbo. No publica nada. Si GitHub llega a desactivarlo por falta de actividad, se reactiva desde la pestaña Actions.
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preparar Python con Pillow
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow
      - name: Importar las vistas de Cloudflare Web Analytics (opcional)
        # Solo lee estadísticas con un token de solo lectura y escribe en metricas/registro.csv. Sin los dos secretos del repositorio se omite;
        # si falla (token vencido, cuenta equivocada) el paso queda en rojo pero no impide el ciclo, y el motivo queda en el resumen de la corrida.
        continue-on-error: true
        env:
          CLOUDFLARE_ANALITICA_TOKEN: ${{ secrets.CLOUDFLARE_ANALITICA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .venv/bin/python -I fabrica.py metricas cloudflare --opcional
      - name: Correr el ciclo
        run: .venv/bin/python -I fabrica.py ciclo
      - name: Guardar el estado si cambió
        if: ${{ always() }}
        run: |
          git config user.name "fabrica-de-juegos"
          git config user.email "fabrica-de-juegos@users.noreply.github.com"
          git add publicacion/PENDIENTE.md metricas/registro.csv motor/piso.json
          git diff --cached --quiet || { git commit -m "Estado del ciclo" && git push; }
