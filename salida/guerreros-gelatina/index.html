<style>
/* Layout: un campo de batalla grande con el marcador arriba y la bandeja de guerreros debajo.
   Paleta: pradera verde, azul contra rojo coral, oro para el botón de pelear. */
:root {
  --bg: #e7efe3;
  --surface: #f6faf3;
  --surface-2: #dbe7d6;
  --ink: #14251b;
  --ink-soft: #46594d;
  --line: #bccfb6;
  --blue: #2f6bdc;
  --red: #e04a34;
  --gold: #f2b705;
  --gold-ink: #2a2000;
  --bad: #b3261e;
  --focus: #1b5fe0;
  --field-a: #a6d57e;
  --field-b: #9bcd73;
  --field-mark: #7fb35a;
  --zone-blue: rgba(47, 107, 220, 0.18);
  --zone-red: rgba(224, 74, 52, 0.18);
  --shadow: rgba(16, 40, 24, 0.28);
  --sel: var(--blue);
  --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "WenQuanYi Micro Hei";  /* chino: tipografías del sistema */
  --font-display: 'Fredoka', var(--cjk), 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito Sans', var(--cjk), system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a16;
    --surface: #15251f;
    --surface-2: #1e342b;
    --ink: #e4efe7;
    --ink-soft: #9fb5a8;
    --line: #2d463b;
    --blue: #6d9bff;
    --red: #ff7d66;
    --gold: #ffc83a;
    --gold-ink: #241a00;
    --bad: #ff8a7a;
    --focus: #8db0ff;
    --field-a: #1d4a3d;
    --field-b: #1a4237;
    --field-mark: #2f6e59;
    --zone-blue: rgba(109, 155, 255, 0.22);
    --zone-red: rgba(255, 125, 102, 0.22);
    --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a16;
  --surface: #15251f;
  --surface-2: #1e342b;
  --ink: #e4efe7;
  --ink-soft: #9fb5a8;
  --line: #2d463b;
  --blue: #6d9bff;
  --red: #ff7d66;
  --gold: #ffc83a;
  --gold-ink: #241a00;
  --bad: #ff8a7a;
  --focus: #8db0ff;
  --field-a: #1d4a3d;
  --field-b: #1a4237;
  --field-mark: #2f6e59;
  --zone-blue: rgba(109, 155, 255, 0.22);
  --zone-red: rgba(255, 125, 102, 0.22);
  --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

/* Añadido v1.1: tinte neutro para las zonas de colocación (el color de cada bando va en el borde). */
:root { --zone-fill: rgba(255, 255, 255, 0.2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --zone-fill: rgba(255, 255, 255, 0.07); } }
:root[data-theme="dark"] { --zone-fill: rgba(255, 255, 255, 0.07); }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  padding-block: 14px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1000px; margin-inline: auto; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font: 700 clamp(1.6rem, 5.5vw, 2.3rem)/1.05 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.head-r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lvl { font: 600 0.85rem var(--font-display); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button {
  font: 600 0.9rem var(--font-display); color: var(--ink-soft); background: transparent; border: 0;
  border-radius: 999px; padding: 7px 16px; min-height: 36px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }

.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.team { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 12px 10px; min-width: 0; }
.team .row { display: flex; align-items: center; gap: 8px; font: 600 1rem var(--font-display); }
.team .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.team.blue .dot, .team.blue .bar i { background: var(--blue); }
.team.red .dot, .team.red .bar i { background: var(--red); }
.team .num { margin-left: auto; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 0.15s linear; }
.cap { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.stage { position: relative; }
canvas#cv { display: block; width: 100%; height: auto; border-radius: 16px; touch-action: none; cursor: crosshair; box-shadow: 0 6px 18px var(--shadow); }
.banner {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(92%, 420px);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px 16px;
  text-align: center; box-shadow: 0 12px 32px var(--shadow);
}
.banner h2 { margin: 0 0 2px; font: 700 1.5rem/1.1 var(--font-display); text-wrap: balance; }
.banner p { margin: 0 0 12px; color: var(--ink-soft); }
.hint { margin: 0; color: var(--ink-soft); min-height: 1.45em; }

.panel { display: grid; gap: 10px; }
.panel[data-team="1"] { --sel: var(--red); }
.rowline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.rowline.end { justify-content: flex-end; }
.rowline.center { justify-content: center; }
.grow { flex: 1 1 auto; }
.sel { display: inline-flex; align-items: center; gap: 8px; font: 600 0.9rem var(--font-display); }
select {
  font: 600 0.9rem var(--font-display); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; min-height: 38px;
}

.tray { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.unit {
  display: grid; justify-items: center; gap: 1px; padding: 6px 6px 8px; min-height: 44px; cursor: pointer;
  border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  font-family: var(--font-body);
}
.unit canvas { width: 48px; height: 48px; display: block; }
.unit .nm { font: 600 0.82rem/1.1 var(--font-display); }
.unit .cost { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.unit .coin { display: inline-block; width: 0.65em; height: 0.65em; border-radius: 50%; background: var(--gold); margin-right: 0.3em; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.22); }
.unit.poor .cost { color: var(--bad); }
.unit[aria-pressed="true"] { border-color: var(--sel); background: color-mix(in srgb, var(--sel) 12%, var(--surface)); }
.unit svg { width: 48px; height: 48px; display: block; stroke: var(--ink-soft); }

.btn {
  font: 600 0.95rem var(--font-display); letter-spacing: 0.01em; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 16px; min-height: 44px; cursor: pointer;
}
.btn:hover { border-color: var(--ink-soft); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; font-size: 1.1rem; padding-inline: 26px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); }
.btn.primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; filter: none; }
.btn:focus-visible, .unit:focus-visible, .seg button:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
/* Paquetes: etiqueta de sección en la bandeja, marco dorado para las Leyendas y la línea de paquetes instalados. */
.pack-label { grid-column: 1 / -1; margin: 4px 0 0; font: 600 0.78rem var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.unit.legend { border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); }
.unit.legend[aria-pressed="true"] { border-color: var(--sel); }

<script id="ggx">
/* GGX · motor común de la fábrica de juegos.
   Todo es opcional: cada plantilla usa lo que necesite. Sin red, sin analítica, sin cookies.
   Lo que ofrece:
     GGX.cfg                      configuración del juego (id, version, idiomas, apoyo_url…) que inyecta la fábrica
     GGX.store.get/set            localStorage con prefijo del juego y respaldo en memoria
     GGX.t(clave, vars) · lang · langs · setLang · onLang     textos por idioma (vienen de juego.json → textos); si falta la clave
                                  en el idioma actual se usa inglés, luego el primer idioma del juego y por último la clave
     GGX.num(n) · langName(l) · langTag(l) · locale() · cjk      número en el formato del idioma · nombre del idioma en su propio idioma ·
                                  etiqueta para el atributo lang de la página (chino → zh-Hans) · locale de Intl · familias tipográficas para chino
                                  El idioma sale de ?lang=xx en la dirección, del último que eligió el jugador o de los del navegador
     GGX.sfx(nombre) · muted() · setMuted(b) · onMute(f)      efectos de sonido sintetizados (WebAudio, sin archivos)
     GGX.onHide(f)                avisa cuando la pestaña se oculta o vuelve (para pausar)
     GGX.ui.muteButton/langButton/supportLink(contenedor)     botones listos, hechos con las variables de color de la plantilla
     GGX.ads                      adaptador de anuncios; por defecto no hace nada (aquí se enchufaría el SDK de un portal)
     GGX.link(url) · GGX.apoyo()  abrir un enlace externo / la página de apoyo del juego
     GGX.rng(semilla)             aleatorio reproducible (pruebas y retos diarios)
     GGX.draw.jelly(...)          la gelatina de la casa, para que todos los juegos compartan identidad */
(function () {
  'use strict';
  const cfg = window.GGX_CONFIG || {};
  const G = (window.GGX = { version: '1.1.0', cfg });
  const cbs = { lang: [], mute: [], hide: [] };
  const fire = (name, ...a) => cbs[name].forEach((f) => { try { f(...a); } catch (e) { console.error('[GGX]', e); } });

  /* ---------- Almacenamiento ---------- */
  const mem = {};
  const key = (k) => (cfg.id || 'ggx') + ':' + k;
  G.store = {
    get(k, d) {
      try { const v = localStorage.getItem(key(k)); if (v !== null) return JSON.parse(v); } catch (e) { /* sin acceso o dato dañado */ }
      return k in mem ? mem[k] : d;
    },
    set(k, v) { mem[k] = v; try { localStorage.setItem(key(k), JSON.stringify(v)); } catch (e) { /* opcional */ } },
  };

  /* ---------- Idiomas ---------- */
  const dict = (window.JUEGO && window.JUEGO.textos) || {};
  const langs = Array.isArray(cfg.idiomas) && cfg.idiomas.length ? cfg.idiomas : ['es'];
  G.langs = langs;
  const NOMBRES = { es: 'Español', en: 'English', zh: '中文', pt: 'Português', hi: 'हिन्दी', fr: 'Français', de: 'Deutsch', ru: 'Русский', ja: '日本語', ar: 'العربية' };
  const ETIQUETA = { zh: 'zh-Hans' };   // lo que va en el atributo lang de la página: en chino decide qué forma tienen los caracteres (simplificada)
  const LOCALE = { es: 'es-MX', en: 'en-US', zh: 'zh-CN', pt: 'pt-BR', hi: 'hi-IN', fr: 'fr-FR', de: 'de-DE', ru: 'ru-RU', ja: 'ja-JP', ar: 'ar' };
  // El chino usa las tipografías del sistema (todo dispositivo configurado en chino las trae); el orden pone primero las de cada plataforma.
  G.cjk = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei"';
  G.langName = (l) => NOMBRES[l] || String(l).toUpperCase();
  G.langTag = (l) => ETIQUETA[l] || l;

  G.num = (n, o) => { try { return new Intl.NumberFormat(G.locale(), o).format(n); } catch (e) { return String(n); } };
  (function pick() {
    let forced = null;
    try { forced = new URLSearchParams(location.search).get('lang'); } catch (e) { /* sin dirección */ }
    const saved = G.store.get('lang', null);
    const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]).map((x) => String(x || '').slice(0, 2).toLowerCase());

    if (vars) s = String(s).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? vars[n] : m));

  };

    if (!langs.includes(l) || l === G.lang) return;

  };
  G.onLang = (f) => { cbs.lang.push(f); };

  /* ---------- Sonido: todo sintetizado, se activa con el primer gesto del jugador ---------- */
  let ctx = null, master = null, muted = !!G.store.get('mute', false), armed = false, voices = 0, nbuf = null, pitch = 1;
  function arm() {

    if (!AC) return;

  }
  const wake = () => { arm(); if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); };
  ['pointerdown', 'keydown', 'touchend'].forEach((ev) => window.addEventListener(ev, wake, { capture: true, passive: true }));

  function tone(o) {
    if (!ctx || muted || voices > 14) return;
    const t0 = ctx.currentTime + (o.at || 0), d = o.d || 0.1;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f * pitch, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2 * pitch), t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.v || 0.2, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    osc.connect(g); g.connect(master);
    voices++; osc.onended = () => { voices--; };
    osc.start(t0); osc.stop(t0 + d + 0.03);
  }
  function noise(o) {
    if (!ctx || muted || voices > 14) return;
    if (!nbuf) {
      nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const a = nbuf.getChannelData(0);
      for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    }
    const t0 = ctx.currentTime + (o.at || 0), d = o.d || 0.1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = nbuf;
    f.type = o.hp ? 'highpass' : 'lowpass';
    f.frequency.setValueAtTime(o.hp || o.lp || 1500, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
    g.gain.setValueAtTime(o.v || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(f); f.connect(g); g.connect(master);
    voices++; src.onended = () => { voices--; };
    src.start(t0); src.stop(t0 + d + 0.03);
  }
  const SFX = {
    click: () => tone({ f: 520, f2: 380, d: 0.06, type: 'triangle', v: 0.16 }),
    pop: () => tone({ f: 300, f2: 760, d: 0.09, type: 'sine', v: 0.24 }),
    jump: () => tone({ f: 260, f2: 640, d: 0.15, type: 'square', v: 0.1 }),
    land: () => { noise({ d: 0.07, v: 0.16, lp: 600 }); tone({ f: 140, f2: 80, d: 0.08, type: 'sine', v: 0.2 }); },
    coin: () => { tone({ f: 880, d: 0.07, type: 'square', v: 0.1 }); tone({ f: 1320, d: 0.15, type: 'square', v: 0.1, at: 0.07 }); },
    hit: () => { noise({ d: 0.08, v: 0.22, lp: 1800 }); tone({ f: 190, f2: 90, d: 0.09, type: 'sawtooth', v: 0.1 }); },
    hurt: () => tone({ f: 330, f2: 110, d: 0.22, type: 'sawtooth', v: 0.16 }),
    boom: () => { noise({ d: 0.5, v: 0.45, lp: 900, to: 120 }); tone({ f: 120, f2: 38, d: 0.45, type: 'sine', v: 0.4 }); },
    zap: () => { tone({ f: 1700, f2: 180, d: 0.28, type: 'sawtooth', v: 0.1 }); noise({ d: 0.22, v: 0.14, hp: 2500 }); },
    heal: () => { tone({ f: 600, f2: 900, d: 0.18, type: 'sine', v: 0.16 }); tone({ f: 900, f2: 1200, d: 0.2, type: 'sine', v: 0.12, at: 0.1 }); },
    whoosh: () => noise({ d: 0.28, v: 0.18, hp: 400, to: 3000 }),
    horn: () => { tone({ f: 196, d: 0.35, type: 'sawtooth', v: 0.1 }); tone({ f: 294, d: 0.35, type: 'sawtooth', v: 0.08, at: 0.02 }); tone({ f: 392, d: 0.5, type: 'sawtooth', v: 0.08, at: 0.3 }); },
    merge: () => { tone({ f: 440, f2: 660, d: 0.12, type: 'triangle', v: 0.2 }); tone({ f: 660, f2: 990, d: 0.16, type: 'triangle', v: 0.16, at: 0.08 }); },
    error: () => tone({ f: 160, d: 0.14, type: 'square', v: 0.1 }),
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone({ f, d: 0.2, type: 'triangle', v: 0.2, at: i * 0.12 })),
    lose: () => [392, 330, 262, 196].forEach((f, i) => tone({ f, d: 0.24, type: 'sawtooth', v: 0.12, at: i * 0.16 })),
  };
  const last = {};
  G.sfx = (name, minMs, rate) => {   // rate: multiplicador de tono (1 = normal; sube 6 % por semitono)
    const f = SFX[name];
    if (!f || !ctx || muted) return;
    const now = performance.now();
    if (now - (last[name] || -1e9) < (minMs == null ? 45 : minMs)) return;
    last[name] = now;
    G.sfx.plays[name] = (G.sfx.plays[name] || 0) + 1;   // las pruebas lo leen para comprobar que el sonido sí se disparó
    pitch = rate || 1;
    try { f(); } catch (e) { /* un sonido nunca rompe el juego */ }
    pitch = 1;
  };
  G.sfx.names = Object.keys(SFX);
  G.sfx.plays = {};
  G.muted = () => muted;
  G.setMuted = (m) => {
    muted = !!m; G.store.set('mute', muted);
    if (master) master.gain.value = muted ? 0 : 0.5;
    fire('mute', muted);
  };
  G.onMute = (f) => { cbs.mute.push(f); };

  /* ---------- Pestaña oculta: pausar y callar ---------- */
  document.addEventListener('visibilitychange', () => {
    if (ctx) { if (document.hidden) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {}); }
    fire('hide', document.hidden);
  });
  G.onHide = (f) => { cbs.hide.push(f); };

  /* ---------- Anuncios: sin SDK no pasa nada. Un portal se enchufa con GGX.ads.use({ interstitial(), rewarded() }) ---------- */
  G.ads = {
    adapter: null,
    use(a) { this.adapter = a; },
    interstitial() { const a = this.adapter; return a && a.interstitial ? Promise.resolve().then(() => a.interstitial()).catch(() => {}) : Promise.resolve(); },
    rewarded() { const a = this.adapter; return a && a.rewarded ? Promise.resolve().then(() => a.rewarded()).then(Boolean).catch(() => false) : Promise.resolve(false); },
  };

  };

  /* ---------- Botones de la casa (heredan las variables de color de la plantilla) ---------- */
  const ICON_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
  let styled = false;
  function style() {
    if (styled) return; styled = true;
    const s = document.createElement('style');
    s.textContent = '.ggx-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 12px;border-radius:12px;' +
      'border:1px solid var(--line,#bbb);background:var(--surface,#fff);color:var(--ink,#111);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none;box-sizing:border-box}' +
      '.ggx-btn:hover{filter:brightness(.97)}.ggx-btn:focus-visible{outline:3px solid var(--focus,#1b5fe0);outline-offset:2px}' +
      '.ggx-lang{padding:0 6px;max-width:9em;appearance:auto;-webkit-appearance:menulist}';
    document.head.appendChild(s);
  }
  G.ui = {
    muteButton(parent) {
      style();
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ggx-btn';
      const paint = () => { b.innerHTML = muted ? ICON_OFF : ICON_ON; b.setAttribute('aria-pressed', String(muted)); b.setAttribute('aria-label', G.t(muted ? 'sonido_activar' : 'sonido_silenciar')); b.title = b.getAttribute('aria-label'); };
      b.addEventListener('click', () => { wake(); G.setMuted(!muted); if (!muted) G.sfx('click', 0); });
      G.onMute(paint); G.onLang(paint); paint();
      if (parent) parent.appendChild(b);
      return b;
    },
    langButton(parent) {   // selector nativo: sirve igual con 2 que con 10 idiomas, y cada uno aparece con su propio nombre
      if (langs.length < 2) return null;
      style();
      const s = document.createElement('select');
      s.className = 'ggx-btn ggx-lang';
      for (const l of langs) { const o = document.createElement('option'); o.value = l; o.textContent = G.langName(l); o.lang = G.langTag(l); s.appendChild(o); }
      const paint = () => { s.value = G.lang; s.setAttribute('aria-label', G.t('idioma_cambiar')); s.title = s.getAttribute('aria-label'); };
      s.addEventListener('change', () => G.setLang(s.value));
      G.onLang(paint); paint();
      if (parent) parent.appendChild(s);
      return s;
    },
    supportLink(parent) {
      if (!cfg.apoyo_url) return null;
      style();
      const a = document.createElement('a');
      a.className = 'ggx-btn'; a.href = cfg.apoyo_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      const paint = () => { a.textContent = G.t('apoyar'); };
      G.onLang(paint); paint();
      if (parent) parent.appendChild(a);
      return a;
    },
  };

  /* Textos comunes que todo juego tiene (el juego puede sobrescribirlos en su juego.json) */
  const base = {
    es: { sonido_silenciar: 'Silenciar sonido', sonido_activar: 'Activar sonido', idioma_cambiar: 'Cambiar idioma', apoyar: 'Apoyar el juego' },
    en: { sonido_silenciar: 'Mute sound', sonido_activar: 'Unmute sound', idioma_cambiar: 'Change language', apoyar: 'Support the game' },
    zh: { sonido_silenciar: '静音', sonido_activar: '开启声音', idioma_cambiar: '切换语言', apoyar: '支持游戏' },
  };
  for (const l of Object.keys(base)) dict[l] = Object.assign({}, base[l], dict[l] || {});

  /* ---------- La gelatina de la casa ---------- */
  G.draw = {
    // o: sx, sy (aplastado/estirado), look (-1..1 hacia dónde mira), blink (bool), shine (bool, por defecto sí)
    jelly(c, x, y, r, col, o) {
      o = o || {};
      c.save(); c.translate(x, y); c.scale(o.sx || 1, o.sy || 1);
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(-r, r * 0.55);
      c.bezierCurveTo(-r * 1.08, -r * 1.3, r * 1.08, -r * 1.3, r, r * 0.55);
      c.quadraticCurveTo(0, r * 0.98, -r, r * 0.55);
      c.closePath(); c.fill();
      if (o.shine !== false) {
        c.fillStyle = 'rgba(255,255,255,0.35)';
        c.beginPath(); c.ellipse(-r * 0.4, -r * 0.5, r * 0.24, r * 0.12, -0.5, 0, Math.PI * 2); c.fill();
      }
      const ex = r * 0.34, ey = -r * 0.08, er = r * 0.2, look = (o.look || 0) * er * 0.35;
      for (const s of [-1, 1]) {
        c.fillStyle = '#fff'; c.beginPath(); c.ellipse(s * ex, ey, er, er * (o.blink ? 0.12 : 1.15), 0, 0, Math.PI * 2); c.fill();
        if (!o.blink) { c.fillStyle = '#14251b'; c.beginPath(); c.arc(s * ex + look, ey + er * 0.1, er * 0.5, 0, Math.PI * 2); c.fill(); }
      }
      c.restore();
    },
  };
})();
</script>
<script id="mod-accesible">
/* GGX · módulo «accesible» · lo que cualquier juego necesita para poder jugarse con otras necesidades.
   Se activa con "motor": ["accesible"] en juego.json. Todo se guarda en el propio dispositivo (GGX.store), sin red.
     GGX.a11y.reducedMotion()          true si el jugador (o su sistema) pidió menos movimiento; los demás módulos lo respetan
     GGX.a11y.highContrast()           true si pidió alto contraste (la interfaz cambia sola; lo que se dibuja en canvas lo decide el juego)
     GGX.a11y.set(clave, valor)        clave: 'reducirMovimiento' | 'altoContraste'; valor: true | false | null (null = seguir al sistema)
     GGX.a11y.onChange(f)              avisa cuando cambia cualquiera de los dos
     GGX.a11y.announce(texto)          lo anuncia un lector de pantalla (región «status»); úsalo para puntaje, fin de partida, errores
     GGX.ui.accessButton(contenedor)   botón con un panel de dos casillas, con los colores de la plantilla (--ink, --surface, --line, --focus)
   Qué NO hace: no convierte por sí solo un juego de canvas en accesible para un lector de pantalla; eso depende de lo que cada juego anuncie. */
(function () {
  'use strict';
  const G = window.GGX;
  if (!G || G.a11y) return;
  const mqMov = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const mqCon = window.matchMedia ? window.matchMedia('(prefers-contrast: more)') : null;
  const guardado = G.store.get('a11y', {}) || {};
  const bool = (v) => (typeof v === 'boolean' ? v : null);
  const ajustes = { reducirMovimiento: bool(guardado.reducirMovimiento), altoContraste: bool(guardado.altoContraste) };
  const cbs = [];
  const root = document.documentElement;
  const mov = () => (ajustes.reducirMovimiento === null ? !!(mqMov && mqMov.matches) : ajustes.reducirMovimiento);
  const con = () => (ajustes.altoContraste === null ? !!(mqCon && mqCon.matches) : ajustes.altoContraste);

  const css = document.createElement('style');
  css.id = 'ggx-a11y-css';
  css.textContent =
    'html[data-reducir-movimiento] *,html[data-reducir-movimiento] *::before,html[data-reducir-movimiento] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}' +
    'html[data-alto-contraste]{--ink:#000;--surface:#fff;--line:#000;--focus:#0033cc}' +
    '.ggx-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}' +
    '.ggx-a11y{position:relative;display:inline-block}' +
    '.ggx-a11y-btn{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line,#bbb);background:var(--surface,#fff);color:var(--ink,#111);font:inherit;cursor:pointer;box-sizing:border-box}' +
    '.ggx-a11y-btn:focus-visible{outline:3px solid var(--focus,#1b5fe0);outline-offset:2px}' +
    '.ggx-a11y-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:14em;padding:10px 12px;border-radius:12px;border:1px solid var(--line,#bbb);background:var(--surface,#fff);color:var(--ink,#111);box-shadow:0 6px 20px rgba(0,0,0,.25);display:grid;gap:8px;font-size:.9rem}' +
    '.ggx-a11y-panel[hidden]{display:none}.ggx-a11y-panel label{display:flex;align-items:center;gap:8px;cursor:pointer}' +
    '.ggx-a11y-panel input{width:18px;height:18px;accent-color:var(--focus,#1b5fe0)}';
  document.head.appendChild(css);

  function aplicar() {
    root.toggleAttribute('data-reducir-movimiento', mov());
    root.toggleAttribute('data-alto-contraste', con());
  }
  const avisar = () => cbs.forEach((f) => { try { f({ reducirMovimiento: mov(), altoContraste: con() }); } catch (e) { console.error('[GGX.a11y]', e); } });
  aplicar();

  const A = (G.a11y = { version: '1.0.0' });
  A.reducedMotion = mov;
  A.highContrast = con;
  A.get = (k) => ajustes[k];
  A.set = (k, v) => {
    if (!(k in ajustes)) return;
    ajustes[k] = bool(v);
    G.store.set('a11y', Object.assign({}, ajustes));
    aplicar(); avisar();
  };

  [mqMov, mqCon].forEach((m) => { if (m && m.addEventListener) m.addEventListener('change', () => { aplicar(); avisar(); }); });

  let live = null;
  function region() {

  }

    el.textContent = '';
    setTimeout(() => { el.textContent = String(texto); }, 30);   // vaciar y volver a escribir: así el lector repite aunque el texto sea el mismo
  };

  /* Textos comunes (el juego puede sobrescribirlos en su juego.json → textos) */
  const base = {
    es: { a11y_titulo: 'Accesibilidad', a11y_reducir: 'Reducir movimiento', a11y_contraste: 'Alto contraste' },
    en: { a11y_titulo: 'Accessibility', a11y_reducir: 'Reduce motion', a11y_contraste: 'High contrast' },
    zh: { a11y_titulo: '无障碍', a11y_reducir: '减少动态效果', a11y_contraste: '高对比度' },
  };
  window.JUEGO = window.JUEGO || {};
  const textos = (window.JUEGO.textos = window.JUEGO.textos || {});   // el mismo objeto que lee GGX.t
  for (const l of Object.keys(base)) textos[l] = Object.assign({}, base[l], textos[l] || {});

  const ICONO = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8"/><path d="M5 8.5h14"/><path d="M12 8.5v5"/><path d="m8.5 20 3.5-6.5 3.5 6.5"/></svg>';
  let n = 0;
  G.ui = G.ui || {};
  G.ui.accessButton = (parent) => {
    const id = 'ggx-a11y-' + (++n);
    const caja = document.createElement('span'); caja.className = 'ggx-a11y';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ggx-a11y-btn ggx-btn'; b.innerHTML = ICONO;
    b.setAttribute('aria-haspopup', 'true'); b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', id);
    const panel = document.createElement('div'); panel.id = id; panel.className = 'ggx-a11y-panel'; panel.hidden = true; panel.setAttribute('role', 'group');
    const filas = [['reducirMovimiento', 'a11y_reducir', mov], ['altoContraste', 'a11y_contraste', con]].map(([clave, texto, leer]) => {
      const l = document.createElement('label'), i = document.createElement('input'), s = document.createElement('span');
      i.type = 'checkbox'; i.checked = leer();
      i.addEventListener('change', () => A.set(clave, i.checked));
      l.appendChild(i); l.appendChild(s); panel.appendChild(l);
      return () => { s.textContent = G.t(texto); i.checked = leer(); };
    });
    const pintar = () => { b.setAttribute('aria-label', G.t('a11y_titulo')); b.title = G.t('a11y_titulo'); panel.setAttribute('aria-label', G.t('a11y_titulo')); filas.forEach((f) => f()); };
    const abrir = (si) => { panel.hidden = !si; b.setAttribute('aria-expanded', String(si)); };
    b.addEventListener('click', () => abrir(panel.hidden));
    caja.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) { abrir(false); b.focus(); } });
    document.addEventListener('pointerdown', (e) => { if (!panel.hidden && !caja.contains(e.target)) abrir(false); }, true);
    G.onLang(pintar); A.onChange(pintar); pintar();
    caja.appendChild(b); caja.appendChild(panel);
    if (parent) parent.appendChild(caja);
    return caja;
  };
})();
</script>
<script id="mod-efectos">
/* GGX · módulo «efectos» · el «jugo» que hace que un golpe, un acierto o una victoria se sientan.
   Se activa con "motor": ["accesible", "efectos"] en juego.json (necesita «accesible»: con menos movimiento pedido no hay partículas, sacudidas ni destellos).
   Es un sistema de partículas y de efectos de pantalla SIN dibujo propio: el juego lo actualiza y lo dibuja en SU canvas.
     GGX.fx.burst(x, y, {n, color|[colores], vel, vida, tam, gravedad, arco:[a0,a1], forma:'circulo'|'cuadro'})   chorro de partículas; devuelve cuántas creó
     GGX.fx.preset('chispas'|'confeti'|'polvo'|'burbujas', x, y)                                                    chorros ya afinados
     GGX.fx.text(x, y, 'texto', {color, borde, px, vida, sube})                                                     texto flotante (puntos, «¡Perfecto!»)
     GGX.fx.shake(magnitud_px, ms) · GGX.fx.flash(color, ms, alfa)                                                  sacudida y destello de pantalla
     GGX.fx.update(dt_segundos)   avanza todo (llámalo una vez por cuadro) · GGX.fx.offset() → {x, y}: desplazamiento de la sacudida (aplícalo con translate)
     GGX.fx.draw(ctx, ancho, alto)   dibuja partículas, textos y destello encima del juego
     GGX.fx.count() · GGX.fx.clear() · GGX.fx.semilla(n)   cuántos efectos hay vivos · vaciar · aleatorio reproducible (pruebas)
   Con «reducir movimiento»: no hay partículas, sacudida ni destello; los textos flotantes se quedan quietos un instante. */
(function () {
  'use strict';
  const G = window.GGX;
  if (!G || G.fx) return;
  const MAX = 400;           // tope de partículas vivas: un celular modesto no debe sufrir por un chorro grande
  const P = [], T = [];
  let rnd = G.rng(20260101), sac = null, des = null, ox = 0, oy = 0;
  const quieto = () => !!(G.a11y && G.a11y.reducedMotion());
  const fx = (G.fx = { version: '1.0.0', creadas: 0, maximo: MAX });
  fx.semilla = (n) => { rnd = G.rng(n); };
  fx.quieto = quieto;

  fx.burst = (x, y, o) => {
    if (quieto()) return 0;
    o = o || {};
    const n = Math.max(0, Math.min(o.n == null ? 12 : o.n | 0, MAX - P.length));
    const cols = Array.isArray(o.color) && o.color.length ? o.color : [o.color || '#ffffff'];
    for (let i = 0; i < n; i++) {
      const a = o.arco ? o.arco[0] + rnd() * (o.arco[1] - o.arco[0]) : rnd() * Math.PI * 2;
      const v = (o.vel == null ? 120 : o.vel) * (0.4 + rnd() * 0.8);
      P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravedad == null ? 260 : o.gravedad, vida: (o.vida || 0.7) * (0.7 + rnd() * 0.6), t: 0,
        r: (o.tam || 4) * (0.6 + rnd() * 0.8), c: cols[(rnd() * cols.length) | 0], forma: o.forma || 'circulo', giro: (rnd() - 0.5) * 8, ang: rnd() * 6.28 });
    }
    fx.creadas += n;
    return n;
  };
  fx.text = (x, y, texto, o) => {
    o = o || {};
    const q = quieto();
    T.push({ x, y, s: String(texto), vida: q ? 0.6 : o.vida || 0.9, t: 0, c: o.color || '#ffffff', borde: o.borde || 'rgba(0,0,0,.45)', px: o.px || 18, sube: q ? 0 : o.sube == null ? 40 : o.sube });
    if (T.length > 40) T.shift();
  };
  fx.shake = (mag, ms) => {
    if (quieto()) return;
    const m = Math.max(0, +mag || 0);
    sac = { mag: sac ? Math.max(m, sac.mag * (1 - sac.t / sac.dur)) : m, t: 0, dur: Math.max(0.05, (ms || 250) / 1000) };
  };
  fx.flash = (color, ms, alfa) => {
    if (quieto()) return;
    des = { c: color || '#ffffff', t: 0, dur: Math.max(0.03, (ms || 160) / 1000), a: alfa == null ? 0.5 : alfa };
  };
  fx.update = (dt) => {
    dt = Math.min(Math.max(dt || 0, 0), 0.05);   // un cuadro perdido no debe lanzar las partículas al otro lado de la pantalla
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.t += dt;
      if (p.t >= p.vida) { P[i] = P[P.length - 1]; P.pop(); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.ang += p.giro * dt;
    }
    for (let i = T.length - 1; i >= 0; i--) { T[i].t += dt; if (T[i].t >= T[i].vida) T.splice(i, 1); }
    if (sac) {
      sac.t += dt;
      if (sac.t >= sac.dur) { sac = null; ox = oy = 0; } else { const k = sac.mag * (1 - sac.t / sac.dur); ox = (rnd() * 2 - 1) * k; oy = (rnd() * 2 - 1) * k; }
    }
    if (des) { des.t += dt; if (des.t >= des.dur) des = null; }
  };
  fx.offset = () => ({ x: ox, y: oy });
  fx.draw = (c, w, h) => {
    c.save();
    for (const p of P) {
      c.globalAlpha = Math.max(0, 1 - p.t / p.vida);
      c.fillStyle = p.c;
      if (p.forma === 'cuadro') { c.save(); c.translate(p.x, p.y); c.rotate(p.ang); c.fillRect(-p.r, -p.r, p.r * 2, p.r * 1.2); c.restore(); }
      else { c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill(); }
    }
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    for (const t of T) {
      const k = t.t / t.vida;
      c.globalAlpha = k < 0.7 ? 1 : Math.max(0, 1 - (k - 0.7) / 0.3);
      c.font = '700 ' + t.px + 'px Fredoka, "Nunito Sans", ' + G.cjk + ', sans-serif';
      const y = t.y - t.sube * k;
      c.lineWidth = Math.max(3, t.px / 5); c.strokeStyle = t.borde; c.strokeText(t.s, t.x, y);
      c.fillStyle = t.c; c.fillText(t.s, t.x, y);
    }
    if (des && w && h) { c.globalAlpha = des.a * (1 - des.t / des.dur); c.fillStyle = des.c; c.fillRect(0, 0, w, h); }
    c.restore();
  };
  fx.count = () => P.length + T.length;
  fx.clear = () => { P.length = 0; T.length = 0; sac = null; des = null; ox = oy = 0; };
  fx.presets = ['chispas', 'confeti', 'polvo', 'burbujas'];
  fx.preset = (nombre, x, y) => {
    switch (nombre) {
      case 'chispas': return fx.burst(x, y, { n: 14, color: ['#ffffff', '#ffe66b'], vel: 180, vida: 0.5, tam: 3 });
      case 'confeti': return fx.burst(x, y, { n: 40, color: ['#5ad1ff', '#ff6bd6', '#ffe66b', '#6bff95', '#ff6b6b'], vel: 260, vida: 1.1, tam: 4, gravedad: 380, arco: [-Math.PI * 0.95, -Math.PI * 0.05], forma: 'cuadro' });
      case 'polvo': return fx.burst(x, y, { n: 8, color: 'rgba(255,255,255,.7)', vel: 50, vida: 0.6, tam: 5, gravedad: -20 });
      case 'burbujas': return fx.burst(x, y, { n: 10, color: 'rgba(255,255,255,.65)', vel: 40, vida: 1.2, tam: 5, gravedad: -80, arco: [-Math.PI * 0.8, -Math.PI * 0.2] });
      default: return 0;
    }
  };
})();
</script>
<script id="mod-musica">
/* GGX · módulo «musica» · música de fondo que se compone sola, sin archivos de audio.
   Se activa con "motor": ["musica"] en juego.json. Cada ánimo tiene su escala, su tempo y su progresión; la semilla fija la melodía, así el mismo juego
   suena igual en todos los dispositivos y cada cuatro vueltas la melodía cambia un poco para no cansar.
     GGX.music.start(animo | {animo, semilla, bpm, escala, raiz, intensidad})   empieza (llámalo desde un toque o tecla del jugador: el navegador no deja sonar antes)
     GGX.music.stop()                    la detiene
     GGX.music.intensidad(0..1)          0 = solo bajo y bombo; sube y entran la melodía, los platillos y la caja (úsalo con el peligro o el combo)
     GGX.music.estado()                  {sonando, animo, bpm, compases, notas, intensidad, silencio}  (las pruebas lo leen)
     GGX.music.plan(semilla, {animo, compases})   la partitura como datos: [{acorde, notas:[{t, midi, dur, v, voz, capa}]}] (sin sonar; reproducible)
     GGX.music.animos                    ['alegre', 'tension', 'calma', 'aventura']
   Respeta el botón de silencio del juego (GGX.muted) y se suspende con la pestaña oculta. Usa su propio AudioContext y un volumen bajo, para no tapar los efectos. */
(function () {
  'use strict';
  const G = window.GGX;
  if (!G || G.music) return;
  const ESCALAS = { 'pentatonica-mayor': [0, 2, 4, 7, 9], 'pentatonica-menor': [0, 3, 5, 7, 10], dorica: [0, 2, 3, 5, 7, 9, 10], mixolidia: [0, 2, 4, 5, 7, 9, 10] };
  const ANIMOS = {
    alegre: { escala: 'pentatonica-mayor', bpm: 112, raiz: 60 },
    tension: { escala: 'pentatonica-menor', bpm: 128, raiz: 57 },
    calma: { escala: 'dorica', bpm: 84, raiz: 55 },
    aventura: { escala: 'mixolidia', bpm: 104, raiz: 57 },
  };
  const PROGRESIONES = [[0, 4, 5, 3], [0, 5, 3, 4], [0, 3, 4, 3], [5, 3, 0, 4]];   // grados de la escala que sostienen el bajo en cada compás
  const VOLUMEN = 0.16;
  const grado = (raiz, escala, g) => { const L = escala.length, o = Math.floor(g / L), i = ((g % L) + L) % L; return raiz + 12 * o + escala[i]; };
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* La partitura como datos: 4 tiempos por compás; t en tiempos desde el inicio del compás; capa = intensidad mínima para que suene. */
  function plan(semilla, o) {
    o = o || {};
    const a = ANIMOS[o.animo] || ANIMOS.alegre;
    const escala = ESCALAS[o.escala] || ESCALAS[a.escala];
    const raiz = o.raiz == null ? a.raiz : o.raiz;
    const rnd = G.rng(semilla == null ? 1 : semilla);
    const prog = PROGRESIONES[(rnd() * PROGRESIONES.length) | 0];
    const n = o.compases || 8;
    const compases = [];
    let g = prog[0] + escala.length;                // la melodía parte una octava arriba del primer acorde
    for (let c = 0; c < n; c++) {
      const acorde = prog[c % prog.length], notas = [];
      const base = grado(raiz - 12, escala, acorde);
      notas.push({ t: 0, midi: base, dur: 1.6, v: 0.9, voz: 'bajo', capa: 0 }, { t: 2, midi: base, dur: 1.6, v: 0.7, voz: 'bajo', capa: 0 });
      notas.push({ t: 0, midi: 0, dur: 0.2, v: 1, voz: 'bombo', capa: 0 }, { t: 2, midi: 0, dur: 0.2, v: 0.9, voz: 'bombo', capa: 0 });
      for (const t of [0.5, 1.5, 2.5, 3.5]) notas.push({ t, midi: 0, dur: 0.1, v: 0.5, voz: 'hat', capa: 0.35 });
      for (const t of [1, 3]) notas.push({ t, midi: 0, dur: 0.2, v: 0.7, voz: 'caja', capa: 0.65 });
      for (let t = 0; t < 4; t += 0.5) {             // melodía: paseo por la escala, que tiende a volver al acorde
        if (rnd() < (t % 1 === 0 ? 0.8 : 0.5)) {
          const hacia = acorde + escala.length, paso = rnd() < 0.5 ? (g < hacia ? 1 : -1) : (rnd() < 0.5 ? 1 : -1) * (1 + ((rnd() * 2) | 0));
          g = Math.max(acorde, Math.min(acorde + escala.length * 2 - 1, g + paso));
          notas.push({ t, midi: grado(raiz, escala, g), dur: t % 1 === 0 ? 0.9 : 0.45, v: 0.55 + rnd() * 0.25, voz: 'melodia', capa: 0.15 });
        }
      }
      compases.push({ acorde, notas });
    }
    return { animo: o.animo in ANIMOS ? o.animo : 'alegre', bpm: o.bpm || a.bpm, raiz, escala, compases };
  }

  const M = (G.music = { version: '1.0.0', animos: Object.keys(ANIMOS), plan });
  let ac = null, master = null, ruido = null, timer = null, voces = 0;
  let cfg = null, vuelta = 0, compas = 0, proximo = 0, intensidad = 0.5, compasesDichos = 0, notasProgramadas = 0, sonando = false, partitura = null;

  function asegurar() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); master = ac.createGain(); master.gain.value = G.muted() ? 0 : VOLUMEN; master.connect(ac.destination); } catch (e) { ac = null; return false; }
    return true;
  }
  const despertar = () => { if (sonando && ac && ac.state === 'suspended') ac.resume().catch(() => {}); };
  ['pointerdown', 'keydown', 'touchend'].forEach((ev) => window.addEventListener(ev, despertar, { capture: true, passive: true }));
  G.onMute((m) => { if (master) master.gain.value = m ? 0 : VOLUMEN; });
  G.onHide((oculta) => { if (!ac || !sonando) return; (oculta ? ac.suspend() : ac.resume()).catch(() => {}); });

  function tono(f, t0, d, tipo, v) {
    if (voces > 24) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master); voces++; o.onended = () => { voces--; };
    o.start(t0); o.stop(t0 + d + 0.03);
  }
  function soplo(t0, d, v, hp) {
    if (voces > 24) return;
    if (!ruido) { ruido = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const x = ruido.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = ruido; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(f); f.connect(g); g.connect(master); voces++; s.onended = () => { voces--; };
    s.start(t0); s.stop(t0 + d + 0.03);
  }
  function sonar(n, t0, seg) {
    const d = Math.max(0.04, n.dur * seg);
    if (n.voz === 'bajo') tono(hz(n.midi), t0, d, 'triangle', 0.5 * n.v);
    else if (n.voz === 'melodia') tono(hz(n.midi), t0, d, 'square', 0.12 * n.v);
    else if (n.voz === 'bombo') { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + 0.14); g.gain.setValueAtTime(0.7 * n.v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.2); }
    else if (n.voz === 'hat') soplo(t0, 0.05, 0.12 * n.v, 7000);
    else if (n.voz === 'caja') { soplo(t0, 0.14, 0.2 * n.v, 1800); tono(190, t0, 0.1, 'triangle', 0.15 * n.v); }
  }

  function programar() {                      // pone en el reloj de audio un compás completo y deja listo el siguiente
    if (!partitura || compas >= partitura.compases.length) {
      if (partitura) { compas = 0; vuelta++; }
      if (!partitura || vuelta % 4 === 0) partitura = plan((cfg.semilla || 1) + (partitura ? vuelta : 0), cfg);
    }
    const seg = 60 / cfg.bpm, c = partitura.compases[compas++];
    for (const n of c.notas) {
      if (n.capa > intensidad + 1e-9) continue;
      notasProgramadas++;
      if (!G.muted()) sonar(n, proximo + n.t * seg, seg);
    }
    compasesDichos++;
    proximo += 4 * seg;
  }
  function reloj() {
    if (!ac || !sonando) return;
    if (proximo < ac.currentTime) proximo = ac.currentTime + 0.05;
    while (proximo < ac.currentTime + 0.25) programar();
  }

  M.start = (o) => {
    o = typeof o === 'string' ? { animo: o } : o || {};
    const a = ANIMOS[o.animo] || ANIMOS.alegre;
    cfg = { animo: o.animo in ANIMOS ? o.animo : 'alegre', semilla: o.semilla == null ? 1 : o.semilla, bpm: o.bpm || a.bpm, escala: o.escala || a.escala, raiz: o.raiz == null ? a.raiz : o.raiz, compases: 8 };
    intensidad = o.intensidad == null ? 0.5 : Math.max(0, Math.min(1, o.intensidad));
    if (!asegurar()) return false;
    M.stop();
    sonando = true; partitura = null; vuelta = 0; compas = 0; proximo = ac.currentTime + 0.05;
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    reloj();
    timer = setInterval(reloj, 50);
    return true;
  };
  M.stop = () => { if (timer) clearInterval(timer); timer = null; sonando = false; };
  M.intensidad = (x) => { intensidad = Math.max(0, Math.min(1, +x || 0)); };
  M.estado = () => ({ sonando, animo: cfg ? cfg.animo : null, bpm: cfg ? cfg.bpm : null, compases: compasesDichos, notas: notasProgramadas, intensidad, silencio: G.muted() });
})();
</script>
<script id="mod-marca">
/* GGX · módulo «marca» · la Gelatina como insignia del Taller: el sello que abre cada juego, su sonido y su distintivo.
   Se activa con "motor": [..., "marca"] en juego.json (ver marca/guia.md para la idea y las reglas de uso).
     GGX.marca.sello({al_terminar, forzar})   la Gelatina cae, se aplasta y saluda con su nombre y su «blup» (≈1,4 s); un toque o una tecla lo salta.
                                              Úsalo cuando el jugador pulsa «Jugar» (el navegador solo deja sonar después de un gesto). Una vez por visita,
                                              salvo forzar:true. Devuelve una promesa con {omitido, saltado}; al_terminar corre en todos los casos.
     GGX.marca.blup()                         el sonido de marca solo (respeta el silencio del juego)
     GGX.marca.distintivo(contenedor, {texto})  el emblema chico (y, con texto:true, el nombre) para una esquina; no es un enlace ni pide nada
     GGX.marca.emblema(px, color)             elemento con el emblema ('verde' | 'rosa' | 'amarilla') · GGX.marca.svg(id) · GGX.marca.nombre
     GGX.marca.estado()                       {sellos, blups, ultimo}  (las pruebas lo leen)
   Con «reducir movimiento» el sello no se anima: se muestra quieto un instante. Es decorativo: no atrapa el foco ni oculta nada al lector de pantalla. */
(function () {
  'use strict';
  const G = window.GGX;
  if (!G || G.marca) return;
  const NOMBRE = 'Taller Gelatina';
  const EMBLEMAS = {   // el mismo dibujo que herramientas/marca.py (una prueba lo verifica); {id} evita que dos emblemas compartan el degradado
    verde: "<svg xmlns='http://www.w3.org/2000/svg' viewBox='-118 -98 236 208' role='img' aria-label='Taller Gelatina'><defs><linearGradient id='g{id}' x1='0' y1='-1' x2='0' y2='1'><stop offset='0' stop-color='#6fe0a6'/><stop offset='1' stop-color='#15804f'/></linearGradient></defs><path d='M-102 62 C-114 -22 -72 -92 0 -92 C72 -92 114 -22 102 62 C99 88 70 102 0 102 C-70 102 -99 88 -102 62 Z' fill='url(#g{id})'/><path d='M-102 62 C-99 88 -70 102 0 102 C70 102 99 88 102 62 C80 80 -80 80 -102 62 Z' fill='#14251b' opacity='.10'/><ellipse cx='-48' cy='-50' rx='30' ry='14' transform='rotate(-35 -48 -50)' fill='#fff' opacity='.55'/><circle cx='-80' cy='-6' r='5' fill='#fff' opacity='.5'/><ellipse cx='-33' cy='6' rx='16' ry='19' fill='#fff'/><ellipse cx='33' cy='6' rx='16' ry='19' fill='#fff'/><circle cx='-30' cy='10' r='9' fill='#14251b'/><circle cx='36' cy='10' r='9' fill='#14251b'/><circle cx='-27' cy='6' r='3' fill='#fff'/><circle cx='39' cy='6' r='3' fill='#fff'/><ellipse cx='-58' cy='38' rx='11' ry='7' fill='#ffc2d8' opacity='.8'/><ellipse cx='58' cy='38' rx='11' ry='7' fill='#ffc2d8' opacity='.8'/><path d='M-15 42 Q0 56 15 42' fill='none' stroke='#14251b' stroke-width='5' stroke-linecap='round'/></svg>",
    colores: { rosa: ['#ff9cc4', '#c2337a', '#ff6f9f'], amarilla: ['#ffd36b', '#e39a00', '#ff9f80'] },
  };
  let contador = 0;
  const svg = (id, color) => {
    let t = EMBLEMAS.verde.split('{id}').join(id || 'm' + (++contador));
    const c = EMBLEMAS.colores[color];
    if (c) t = t.split('#6fe0a6').join(c[0]).split('#15804f').join(c[1]).split('#ffc2d8').join(c[2]);
    return t;
  };

  const M = (G.marca = { version: '1.0.0', nombre: NOMBRE, svg });
  const est = { sellos: 0, blups: 0, ultimo: null };
  const quieto = () => !!(G.a11y && G.a11y.reducedMotion());

  M.emblema = (px, color) => {
    const e = document.createElement('span');
    e.style.cssText = 'display:inline-block;line-height:0;width:' + (px || 48) + 'px';
    e.innerHTML = svg(null, color);
    return e;
  };
  M.estado = () => Object.assign({}, est);

  /* El «blup»: dos gotas de tono, una sube y otra se asienta. Su propio AudioContext, volumen bajo. */
  let ac = null;
  M.blup = () => {
    if (G.muted()) return false;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      if (!ac) ac = new AC();
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      const t0 = ac.currentTime + 0.01;
      [[300, 640, 0.1, 'triangle', 0.2, 0], [640, 380, 0.16, 'sine', 0.16, 0.09]].forEach(([f, f2, d, tipo, v, at]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = tipo; o.frequency.setValueAtTime(f, t0 + at); o.frequency.exponentialRampToValueAtTime(f2, t0 + at + d);
        g.gain.setValueAtTime(0.0001, t0 + at); g.gain.exponentialRampToValueAtTime(v, t0 + at + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d);
        o.connect(g); g.connect(ac.destination); o.start(t0 + at); o.stop(t0 + at + d + 0.03);
      });
      est.blups++;
      return true;
    } catch (e) { return false; }
  };

  let estilo = null, visto = false;
  const ponerEstilo = () => {
    if (estilo) return;
    estilo = document.createElement('style');
    estilo.id = 'ggx-marca-css';
    estilo.textContent =
      '.ggx-sello{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;' +
      'background:radial-gradient(circle at 30% 25%,#fff6fa 0%,#fbf8f1 45%,#f3d6e4 100%);color:#c2337a;font:700 1.7rem/1.1 Fredoka,"Nunito Sans",' + G.cjk + ',sans-serif;opacity:1;transition:opacity .25s}' +
      '.ggx-sello.fuera{opacity:0}.ggx-sello .gel{width:min(34vmin,170px);transform-origin:50% 100%;animation:ggx-cae .9s cubic-bezier(.3,.7,.4,1) both}' +
      '.ggx-sello .nom{opacity:0;animation:ggx-nombre .5s .55s ease-out both;letter-spacing:-.5px}' +

<script>
(() => {

/* ---------- Guerreros ---------- (los nombres de aquí son el respaldo; los que se ven vienen de textos → u_<id>) */
const UNITS = {

   pon otro <script> DESPUÉS de este y registra un paquete:

     GuerrerosGelatina.registerPack({
       id: 'mi-dlc', name: 'Mi DLC', version: '1.0.0',
       units: { ninja: {
         name: 'Ninja', cost: 180, hp: 80, speed: 90, r: 9, range: 14, dmg: 14, cd: 0.6, kind: 'melee', kb: 80,
         ability: { cd: 6, ready: (u, api) => api.enemies(u, 120).length > 0, cast(u, api) { api.stun(api.enemies(u, 120)[0], 1.2); } },
         draw(c, col, r, o, h) { c.fillStyle = '#222'; c.fillRect(-r * 0.9, -r * 0.7, r * 1.8, r * 0.3); }  // accesorios
       } },
     });

   Parchar algo que ya existe (se aplica al arrancar, o al instante si el juego ya arrancó):
     GuerrerosGelatina.patch('equilibrio-1', (gg) => { gg.units.caballero.hp = 200; });

   REFERENCIA
   Unidad:  name, cost, hp, speed, r (radio), range, dmg, cd (segundos entre ataques), kb (empuje), aoe (radio del daño en área),
            kind: melee | bow | magic | bomb | smash. Pasivos opcionales: lifesteal (0 a 1), multishot (n.º de flechas), accurate.
            Extras: tag ('leyenda' = halo dorado, y solo sale en rivales con presupuesto grande), tip (ayuda al elegirla), iconScale,
            hat (altura del sombrero para la barra de vida), hidden (no aparece en la bandeja), draw(c, col, r, o, h) y ability.
   Idiomas: name, tip y las frases de api.say pueden ser un texto, un objeto { es: '…', en: '…', zh: '…' } o una función que devuelve
            el texto; también se pueden poner en juego.json → textos con las claves u_<id>, u_<id>_tip y u_<id>_dice, que tienen
            prioridad. GuerrerosGelatina.t(clave, vars), .L(valor), .unitName(id) y .unitTip(id) dan el texto en el idioma actual.
   Poder:   { cd, first, ready(u, api), cast(u, api), tick(u, api, dt) } con cd y first en segundos. "ability" puede ser ese objeto
            o el nombre de uno registrado con registerAbility / pack.abilities.
   api:     enemies(u, R) allies(u, R) fallen(u, R) · hurt(t, dmg, from, kb) heal(t, n) explode(x, y, R, dmg, kb, team, {src, color})
            stun(t, s) stone(t, s) fear(t, s, from) revive(t, fracción) morph(t, tipo) spawn(tipo, equipo, x, y) shoot(kind, u, t, {dmg})
            say(u, texto|{es,en,zh}, color) bolt(x0, y0, x1, y1, color) ring burst shake later(segundos, fn) · api.state es el estado completo.

const GG = window.GuerrerosGelatina = {
  version: '1.3.0', booted: false,
  units: UNITS, order: ORDER,
  t: tr, L, unitName, unitTip,
  packs: { base: { id: 'base', name: 'Base', version: '1.3.0' } },
  abilities: {}, drawers: {}, hooks: {}, patches: [], api: null,
  registerAbility(id, def) { if (id && def && typeof def.cast === 'function') GG.abilities[id] = def; },
  registerUnit(id, def, quiet) {
    if (!id || !def) return;
    const fresh = !UNITS[id];
    UNITS[id] = Object.assign({ name: id, cost: 100, hp: 100, speed: 50, r: 10, range: 16, dmg: 10, cd: 1, kind: 'melee', kb: 80 }, UNITS[id], def);
    if (typeof def.draw === 'function') GG.drawers[id] = def.draw;
    if (def.ability && typeof def.ability === 'object') { GG.abilities[id] = def.ability; UNITS[id].ability = id; }
    if (fresh && !def.hidden) ORDER.push(id);
    if (GG.booted && !quiet) refreshPacks();
  },
  registerPack(pack) {
    if (!pack || !pack.id) return;
    GG.packs[pack.id] = { id: pack.id, name: pack.name || pack.id, version: pack.version || '1.0.0' };
    for (const id of Object.keys(pack.abilities || {})) GG.registerAbility(id, pack.abilities[id]);
    for (const id of Object.keys(pack.units || {})) GG.registerUnit(id, Object.assign({ pack: pack.id }, pack.units[id]), true);
    if (typeof pack.setup === 'function') { try { pack.setup(GG); } catch (err) { console.error('[Guerreros Gelatina] ' + pack.id, err); } }
    if (GG.booted) refreshPacks();
  },
  patch(id, fn) {
    if (!id || typeof fn !== 'function') return;

  on(ev, fn) { (GG.hooks[ev] = GG.hooks[ev] || []).push(fn); return fn; },
  off(ev, fn) { const L = GG.hooks[ev]; if (L) GG.hooks[ev] = L.filter((f) => f !== fn); },

function refreshPacks() { buildTray(); updatePacksLine(); syncUI(); }

/* ---------- Estado ---------- */
const G = {
  mode: 'reto', phase: 'place', units: [], nextId: 1,
  W: 960, H: 540, portrait: false, scale: 1, decor: [],
  team: 0, tool: 'campesino', level: 1, best: 0, budgetLibre: 1000,
  speedIdx: 1, paused: false, snapshot: null, maxTotal: [1, 1],
  projectiles: [], fx: [], parts: [], timers: [], shake: 0, t: 0, rt: 0, acc: 0,
  cursor: null, overTimer: 0, result: null,
};
const T = { blue: '#2f6bdc', red: '#e04a34', fieldA: '#a6d57e', fieldB: '#9bcd73', mark: '#7fb35a', zoneBlue: 'rgba(47,107,220,.18)', zoneRed: 'rgba(224,74,52,.18)', zoneFill: 'rgba(255,255,255,.2)', shadow: 'rgba(16,40,24,.28)', ink: '#14251b' };

function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  const g = (n, d) => (cs.getPropertyValue(n) || '').trim() || d;
  T.blue = g('--blue', T.blue); T.red = g('--red', T.red);
  T.fieldA = g('--field-a', T.fieldA); T.fieldB = g('--field-b', T.fieldB); T.mark = g('--field-mark', T.mark);
  T.zoneBlue = g('--zone-blue', T.zoneBlue); T.zoneRed = g('--zone-red', T.zoneRed); T.zoneFill = g('--zone-fill', T.zoneFill);
  T.shadow = g('--shadow', T.shadow); T.ink = g('--ink', T.ink);
}
const teamColor = (t) => (t === 0 ? T.blue : T.red);

/* ---------- Mundo ---------- */
function chooseWorld() {
  const stage = $('stage');
  const w = Math.min(window.innerWidth || 1000, (stage && stage.clientWidth) || 1000);
  G.portrait = w < 600;
  G.W = G.portrait ? 520 : 960;
  G.H = G.portrait ? 680 : 540;
  G.decor = [];
  for (let i = 0; i < 70; i++) G.decor.push({ x: 10 + Math.random() * (G.W - 20), y: 14 + Math.random() * (G.H - 20) });
  resize();
}
function resize() {
  const parent = cv.parentElement;
  const w = Math.max(240, (parent && parent.clientWidth) || G.W);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.aspectRatio = G.W + ' / ' + G.H;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round((w * G.H / G.W) * dpr);
  G.scale = cv.width / G.W;
}
function zone(team) {
  const { W, H, portrait } = G, m = 26;
  if (!portrait) return team === 0 ? { x0: m, y0: m, x1: W * 0.42, y1: H - m } : { x0: W * 0.58, y0: m, x1: W - m, y1: H - m };
  return team === 0 ? { x0: m, y0: H * 0.58, x1: W - m, y1: H - m } : { x0: m, y0: m, x1: W - m, y1: H * 0.42 };
}
/* Economía del modo Reto (se ajusta en juego.json → parametros.reto): el jugador empieza con oro_inicial y recibe oro_por_nivel
   más en cada nivel nuevo; el rival arranca en rival_inicial y suma rival_por_nivel por nivel. Su ejército de un nivel se conserva
   al pasar al siguiente, así que el oro extra sirve para añadir guerreros. */
const RETO = Object.assign({ oro_inicial: 1000, oro_por_nivel: 150, rival_inicial: 450, rival_por_nivel: 200 },
  ((window.JUEGO && window.JUEGO.parametros) || {}).reto);
const oroJugador = (nivel) => RETO.oro_inicial + RETO.oro_por_nivel * (nivel - 1);
const oroRival = (nivel) => RETO.rival_inicial + RETO.rival_por_nivel * nivel;
const budgetOf = (team) => (G.mode === 'reto' ? (team === 0 ? oroJugador(G.level) : oroRival(G.level)) : G.budgetLibre);
GG.reto = RETO;           // objeto vivo: un parche puede cambiar, por ejemplo, GuerrerosGelatina.reto.oro_por_nivel
GG.oro = budgetOf;        // oro total de un bando (0 azul, 1 rojo) en el momento actual
function spentOf(team) {

  return s;
}
const editableTeam = () => (G.mode === 'reto' ? 0 : G.team);

/* Poderes: cuenta regresiva inicial de cada unidad, y curación (también la usa el robo de vida). */
function abFirst(type) {
  const A = GG.abilities[UNITS[type].ability];
  return A ? (A.first != null ? A.first : (A.cd || 8) * 0.4) : 0;
}
function heal(t, n) {
  if (t.dead || n <= 0) return;
  t.hp = Math.min(t.max, t.hp + n);
  burst(t.x, t.y - t.r, '#5bd18a', 1, 0.4);
}

function mk(type, team, x, y) {
  const P = UNITS[type];
  const up = G.portrait;
  return {
    id: G.nextId++, type, team, x, y, r: P.r, hp: P.hp, max: P.hp,
    mvx: 0, mvy: 0, kx: 0, ky: 0, cd: 0.3 + Math.random() * 0.5, retarget: Math.random() * 0.3, target: null, atkTarget: null,
    swing: 0, hitDue: 0, sx: 0, sv: 0, flash: 0, stun: 0,
    stone: 0, fear: 0, fx0: 0, fy0: 0, dmgMul: 1, spdMul: 1, abCd: abFirst(type),
    face: up ? (team === 0 ? -Math.PI / 2 : Math.PI / 2) : (team === 0 ? 0 : Math.PI), dirx: team === 0 ? 1 : -1,
    dead: false, gone: false, deadT: 0, spin: 0, rot: 0, bob: 0, bobT: Math.random() * 10, moving: false,
  };
}

function canPlace(type, team, x, y, free) {
  const P = UNITS[type], z = zone(team);
  if (x - P.r < z.x0 || x + P.r > z.x1 || y - P.r < z.y0 || y + P.r > z.y1) return false;
  if (!free && P.cost > budgetOf(team) - spentOf(team)) return false;
  for (const u of G.units) {
    if (u.dead) continue;
    if (Math.hypot(u.x - x, u.y - y) < u.r + P.r - 3) return false;
  }
  return true;
}

function genArmy(team, budget) {
  let left = budget;
  const z = zone(team);
  const weights = { campesino: 5, arquero: 3, caballero: 3, bruja: 1.6, pollo: 2, gigante: budget >= 1200 ? 1.3 : 0.5 };
  // Las Leyendas solo aparecen en rivales con presupuesto grande (nivel 3 en adelante en el modo Reto).
  const wOf = (t) => (weights[t] != null ? weights[t] : UNITS[t].tag === 'leyenda' ? (budget >= 900 ? 0.35 : 0) : 1);
  for (let guard = 0; guard < 400; guard++) {
    const options = ORDER.filter((t) => UNITS[t].cost <= left && wOf(t) > 0);
    if (!options.length) break;
    let total = 0;
    for (const t of options) total += wOf(t);
    let roll = Math.random() * total, pick = options[0];
    for (const t of options) { roll -= wOf(t); if (roll <= 0) { pick = t; break; } }
    const P = UNITS[pick];
    let placed = false;
    for (let k = 0; k < 60 && !placed; k++) {
      const x = z.x0 + P.r + Math.random() * (z.x1 - z.x0 - 2 * P.r);
      const y = z.y0 + P.r + Math.random() * (z.y1 - z.y0 - 2 * P.r);
      if (canPlace(pick, team, x, y, true)) { G.units.push(mk(pick, team, x, y)); left -= P.cost; placed = true; }
    }
    if (!placed) break;
  }
}

/* ---------- Simulación ---------- */
function nearestEnemy(u) {
  let best = null, bd = 1e12;
  for (const e of G.units) {
    if (e.dead || e.team === u.team) continue;
    const d = (e.x - u.x) * (e.x - u.x) + (e.y - u.y) * (e.y - u.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function aliveCount(team) {
  let n = 0;
  for (const u of G.units) if (!u.dead && u.team === team) n++;
  return n;
}

function burst(x, y, col, n, sp) {
  for (let i = 0; i < n && G.parts.length < 420; i++) {
    const a = Math.random() * TAU, v = (40 + Math.random() * 120) * (sp || 1);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0.45 + Math.random() * 0.3, max: 0.75, c: col, s: 2 + Math.random() * 2.5 });
  }
}
function ring(x, y, R, col) { G.fx.push({ x, y, r: R * 0.3, R, life: 0.35, max: 0.35, c: col }); }
function shakeIt(v) { if (!quiet()) G.shake = Math.max(G.shake, v); }

function hurt(t, dmg, fx, fy, kb, src) {
  if (t.dead) return;
  if (t.stone > 0) { kb = 0; dmg *= 1.5; } // la piedra no sale volando y se rompe más fácil
  t.hp -= dmg; t.flash = 0.12; if (!(t.stone > 0)) t.sv += 3;
  const dx = t.x - fx, dy = t.y - fy, d = Math.hypot(dx, dy) || 1;
  const m = Math.max(0.5, (t.r * t.r) / 81);
  t.kx += (dx / d) * kb / m; t.ky += (dy / d) * kb / m;
  if (kb / m > 140) t.stun = Math.max(t.stun, Math.min(0.6, kb / m / 400));
  burst(t.x, t.y, teamColor(t.team), 3, 0.8);
  const S = src && UNITS[src.type];
  if (S && S.lifesteal && src !== t) heal(src, dmg * S.lifesteal);
  GG.emit('unit:hit', t, dmg, src);
  if (t.hp <= 0) die(t, dx / d, dy / d, kb);
}
function die(t, dx, dy, kb) {
  t.dead = true; t.deadT = 0; t.hp = 0; t.target = null;
  const m = Math.max(0.5, (t.r * t.r) / 81);
  t.kx += (dx * (180 + kb * 0.6)) / m; t.ky += (dy * (180 + kb * 0.6)) / m;
  t.spin = (Math.random() - 0.5) * 10; t.rot = 0; t.sx = 0;
  burst(t.x, t.y, teamColor(t.team), 8, 1.3);
  if (t.stone > 0) burst(t.x, t.y, '#bdb7a8', 10, 1.1); // la estatua se hace pedazos
  t.stone = 0; t.fear = 0;
  GG.emit('unit:die', t);
}
function explode(x, y, R, dmg, kb, team, o) {
  o = o || {};
  for (const e of G.units) {
    if (e.dead || e.team === team) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d > R + e.r) continue;
    const f = 1 - 0.5 * Math.min(1, d / (R + e.r));
    hurt(e, dmg * f, x, y, kb * f, o.src);
  }
  ring(x, y, R, o.color || '#ffb53a');
  burst(x, y, o.color || '#ffb53a', o.n || 14, 1.2);
  if (o.white) burst(x, y, '#ffffff', 8, 1);
  shakeIt(o.shake || 4);
}

function shoot(kind, u, t, o) {
  o = o || {};
  const P = UNITS[u.type], sp = kind === 'arrow' ? 400 : 230, jit = o.accurate ? 0 : 0.09;
  const ox = u.x + u.dirx * u.r * 0.8, oy = u.y - u.r * 0.3;
  const d0 = Math.hypot(t.x - ox, t.y - oy), lead = d0 / sp;
  const tx = t.x + (t.mvx + t.kx) * lead * 0.7 + (Math.random() - 0.5) * d0 * jit;
  const ty = t.y + (t.mvy + t.ky) * lead * 0.7 + (Math.random() - 0.5) * d0 * jit;
  G.projectiles.push({ kind, sx: ox, sy: oy, x: ox, y: oy, tx, ty, sp, team: u.team, dmg: o.dmg != null ? o.dmg : P.dmg * u.dmgMul, kb: P.kb, aoe: P.aoe || 0, total: Math.hypot(tx - ox, ty - oy) || 1, trav: 0, k: 0, src: u });
}

function beginAttack(u, t) {
  const P = UNITS[u.type];
  if (P.kind === 'bomb') {
    explode(u.x, u.y, P.aoe, P.dmg, P.kb, u.team, { color: '#ffb53a', n: 20, white: true, shake: 9 });
    u.dead = true; u.gone = true;
    return;
  }
  u.cd = P.cd * (0.9 + Math.random() * 0.2);
  u.swing = 1;
  u.hitDue = (P.kind === 'bow' || P.kind === 'magic') ? 0.2 : 0.14;
  u.atkTarget = t;
}
function resolveAttack(u) {
  const P = UNITS[u.type], t = u.atkTarget;
  if (!t || u.dead || u.stone > 0 || u.fear > 0) return;
  if (P.kind === 'melee') {
    if (t.dead) return;
    const gap = Math.hypot(t.x - u.x, t.y - u.y) - u.r - t.r;
    if (gap > P.range * 2 + 6) return;
    hurt(t, P.dmg * u.dmgMul, u.x, u.y, P.kb, u);
  } else if (P.kind === 'smash') {
    const a = Math.atan2(t.y - u.y, t.x - u.x), reach = u.r + P.range * 0.7;
    explode(u.x + Math.cos(a) * reach, u.y + Math.sin(a) * reach, P.aoe, P.dmg * u.dmgMul, P.kb, u.team, { color: '#d8cfb8', n: 10, shake: 6, src: u });
  } else if (P.kind === 'bow') {
    if (!t.dead) {
      const opt = { accurate: P.accurate };
      shoot('arrow', u, t, opt);
      for (let k = 1; k < (P.multishot || 1); k++) { // flechas extra: a otros enemigos cerca del objetivo, si hay
        let alt = null, bd = 90;
        for (const e of G.units) {
          if (e.dead || e.team === u.team || e === t || e.shotMark === G.t) continue;
          const d = Math.hypot(e.x - t.x, e.y - t.y);
          if (d < bd) { bd = d; alt = e; }
        }
        if (alt) alt.shotMark = G.t;
        shoot('arrow', u, alt || t, opt);
      }
    }
  } else if (P.kind === 'magic') {
    if (!t.dead) shoot('fire', u, t);
  }
}

function updateUnit(u, dt) {
  if (u.dead) {
    u.deadT += dt; u.x += u.kx * dt; u.y += u.ky * dt;
    if (u.flash > 0) u.flash -= dt; // sin esto los caídos se quedaban blancos para siempre
    const f = Math.exp(-4 * dt); u.kx *= f; u.ky *= f;
    u.rot += u.spin * dt; u.spin *= Math.exp(-3 * dt);
    u.x = Math.max(u.r, Math.min(G.W - u.r, u.x)); u.y = Math.max(u.r, Math.min(G.H - u.r, u.y));
    if (u.deadT > 4.5) u.gone = true;
    return;
  }
  const P = UNITS[u.type], spd = P.speed * u.spdMul;
  u.cd -= dt; u.retarget -= dt;
  if (u.swing > 0) u.swing = Math.max(0, u.swing - dt * 4);
  if (u.flash > 0) u.flash -= dt;
  u.sv += (-110 * u.sx - 8 * u.sv) * dt; u.sx += u.sv * dt;
  u.sx = Math.max(-0.45, Math.min(0.45, u.sx));
  if (u.stun > 0) u.stun -= dt;
  if (u.stone > 0) u.stone -= dt;
  if (u.fear > 0) u.fear -= dt;
  const AB = G.phase === 'fight' ? GG.abilities[P.ability] : null;
  if (AB) { // poder activo de la unidad (ver GG.registerAbility)
    if (AB.tick) { try { AB.tick(u, api, dt); } catch (err) { AB.tick = null; console.error('[Guerreros Gelatina] tick', err); } }
    u.abCd -= dt;
    if (u.abCd <= 0 && u.stun <= 0 && u.stone <= 0 && u.fear <= 0) {
      try { if (!AB.ready || AB.ready(u, api)) { u.abCd = AB.cd || 8; AB.cast(u, api); } }
      catch (err) { u.abCd = 99; console.error('[Guerreros Gelatina] poder', err); }
    }
  }

  let wantx = 0, wanty = 0;
  if (u.stun <= 0 && u.fear > 0) { // asustado: huye de quien lo asustó y no ataca
    const dx = u.x - u.fx0, dy = u.y - u.fy0, d = Math.hypot(dx, dy) || 1;
    wantx = (dx / d) * spd * 1.05; wanty = (dy / d) * spd * 1.05;
    if (Math.abs(dx / d) > 0.25) u.dirx = dx > 0 ? 1 : -1;
  } else if (u.stun <= 0) {
    if (!u.target || u.target.dead || u.retarget <= 0) { u.target = nearestEnemy(u); u.retarget = 0.25 + Math.random() * 0.25; }
    const t = u.target;
    if (t) {
      const dx = t.x - u.x, dy = t.y - u.y, d = Math.hypot(dx, dy) || 1;
      u.face = Math.atan2(dy, dx);
      if (Math.abs(dx / d) > 0.25) u.dirx = dx > 0 ? 1 : -1;
      const ranged = P.kind === 'bow' || P.kind === 'magic';
      const inRange = ranged ? d <= P.range : d - u.r - t.r <= P.range;
      if (!inRange) { wantx = (dx / d) * spd; wanty = (dy / d) * spd; }
      else if (ranged && d < P.range * 0.32) { wantx = (-dx / d) * spd * 0.7; wanty = (-dy / d) * spd * 0.7; }
      if (inRange && u.cd <= 0) { beginAttack(u, t); if (u.gone) return; }
    }
  }
  if (u.hitDue > 0) { u.hitDue -= dt; if (u.hitDue <= 0) resolveAttack(u); }

  const e = Math.min(1, dt * 7);
  u.mvx += (wantx - u.mvx) * e; u.mvy += (wanty - u.mvy) * e;
  u.x += (u.mvx + u.kx) * dt; u.y += (u.mvy + u.ky) * dt;
  const kd = Math.exp(-5 * dt); u.kx *= kd; u.ky *= kd;
  const sp = Math.hypot(u.mvx, u.mvy);
  u.moving = sp > 8;
  if (u.moving) u.bobT += dt * (sp / 40 + 6);
  u.bob = u.moving ? Math.abs(Math.sin(u.bobT)) * 3 : 0;
  if (!u.target && G.phase === 'fight') u.bob = Math.abs(Math.sin(G.t * 6 + u.id)) * 5;
  u.x = Math.max(u.r, Math.min(G.W - u.r, u.x)); u.y = Math.max(u.r, Math.min(G.H - u.r, u.y));
}

function separate() {
  const us = G.units, n = us.length;
  for (let i = 0; i < n; i++) {
    const a = us[i];
    if (a.dead) continue;
    for (let j = i + 1; j < n; j++) {
      const b = us[j];
      if (b.dead) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      const min = a.r + b.r - 1;
      if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
      let d = Math.hypot(dx, dy);
      if (d >= min) continue;
      if (d < 0.01) { const ang = Math.random() * TAU; dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
      const nx = dx / d, ny = dy / d, pen = min - d;
      const ma = a.r * a.r, mb = b.r * b.r, s = ma + mb;
      const pa = (pen * mb / s) * 0.6, pb = (pen * ma / s) * 0.6;
      a.x -= nx * pa; a.y -= ny * pa; b.x += nx * pb; b.y += ny * pb;
    }
  }
}

function updateProjectiles(dt) {
  const keep = [];
  for (const p of G.projectiles) {
    const step = p.sp * dt, rem = p.total - p.trav;
    if (p.kind === 'fire' && G.parts.length < 420) G.parts.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, life: 0.3, max: 0.3, c: '#c28bff', s: 2.5 });
    if (step >= rem) {
      if (p.kind === 'arrow') {
        let hit = null, bd = 1e9;
        for (const e of G.units) {
          if (e.dead || e.team === p.team) continue;
          const d = Math.hypot(e.x - p.tx, e.y - p.ty);
          if (d <= e.r + 7 && d < bd) { bd = d; hit = e; }
        }
        if (hit) hurt(hit, p.dmg, p.sx, p.sy, p.kb, p.src);
        else burst(p.tx, p.ty, '#c9b27a', 3, 0.5);
      } else {
        explode(p.tx, p.ty, p.aoe, p.dmg, p.kb, p.team, { color: '#c28bff', n: 12, shake: 2, src: p.src });
      }
      continue;
    }
    p.trav += step; p.k = p.trav / p.total;
    p.x = p.sx + (p.tx - p.sx) * p.k; p.y = p.sy + (p.ty - p.sy) * p.k;
    keep.push(p);
  }
  G.projectiles = keep;
}
function updateFx(dt) {
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; }
  G.parts = G.parts.filter((p) => p.life > 0);
  for (const f of G.fx) { f.life -= dt; if (f.vy) f.y += f.vy * dt; }
  G.fx = G.fx.filter((f) => f.life > 0);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
}

function step(dt) {
  G.t += dt;
  if (G.timers.length) runTimers(dt);
  for (const u of G.units) updateUnit(u, dt);
  GG.emit('tick', dt);
  separate();
  updateProjectiles(dt);
  updateFx(dt);
  if (G.units.some((u) => u.gone)) G.units = G.units.filter((u) => !u.gone);
  let corpses = 0;
  for (const u of G.units) if (u.dead) corpses++;
  if (corpses > 140) {
    const dead = G.units.filter((u) => u.dead).sort((a, b) => b.deadT - a.deadT);
    for (let i = 0; i < corpses - 140; i++) dead[i].gone = true;
  }
  if (G.phase === 'fight') {
    const a0 = aliveCount(0), a1 = aliveCount(1);
    if (a0 === 0 || a1 === 0) {
      G.overTimer += dt;
      if (G.overTimer > 1.1) endBattle(a0 > 0 ? 0 : a1 > 0 ? 1 : -1, a0 + a1);
    }
  }
}

/* ---------- Herramientas para poderes y paquetes (GuerrerosGelatina.api) ----------
   Un poder recibe (unidad, api). Las listas vienen ordenadas del más cercano al más lejano. */
function near(u, R, ok) {
  const out = [];
  for (const e of G.units) {
    if (e === u || !ok(e)) continue;
    const d = Math.hypot(e.x - u.x, e.y - u.y);
    if (R == null || d <= R + e.r) out.push([d, e]);
  }
  return out.sort((a, b) => a[0] - b[0]).map((p) => p[1]);
}
function runTimers(dt) {
  const due = [];
  G.timers = G.timers.filter((m) => { m.t -= dt; if (m.t > 0) return true; due.push(m); return false; });
  for (const m of due) { try { m.fn(); } catch (err) { console.error('[Guerreros Gelatina] later', err); } }
}
const api = GG.api = {
  state: G, TAU,
  enemies: (u, R) => near(u, R, (e) => !e.dead && e.team !== u.team),
  allies: (u, R) => near(u, R, (e) => !e.dead && e.team === u.team),
  fallen: (u, R) => near(u, R, (e) => e.dead && !e.gone && e.team === u.team), // caídos recientes de su bando
  hurt: (t, dmg, from, kb) => hurt(t, dmg, from.x, from.y, kb || 0, from),
  explode: (x, y, R, dmg, kb, team, o) => explode(x, y, R, dmg, kb, team, o),
  heal, burst, ring, shake: shakeIt,
  stun(t, s) { if (!t.dead) t.stun = Math.max(t.stun, s); },
  stone(t, s) { if (t.dead) return; t.stone = Math.max(t.stone, s); t.stun = Math.max(t.stun, s); t.kx = 0; t.ky = 0; ring(t.x, t.y, t.r * 2, '#cfc8b8'); },
  fear(t, s, from) { if (t.dead) return; t.fear = Math.max(t.fear, s); t.fx0 = from.x; t.fy0 = from.y; },
  revive(t, frac) {
    if (!t.dead || t.gone) return false;
    t.dead = false; t.deadT = 0; t.hp = Math.max(1, t.max * (frac || 0.5)); t.rot = 0; t.spin = 0; t.sx = 0; t.sv = 0;
    t.kx = 0; t.ky = 0; t.mvx = 0; t.mvy = 0; t.stun = 0.5; t.stone = 0; t.fear = 0;
    t.target = null; t.atkTarget = null; t.hitDue = 0; t.swing = 0; t.cd = 0.6; t.abCd = abFirst(t.type);
    ring(t.x, t.y, 34, '#ffd24a'); burst(t.x, t.y, '#ffd24a', 14, 1);
    return true;
  },
  morph(t, type) {
    const P = UNITS[type];
    if (!P || t.dead) return;
    t.type = type; t.r = P.r; t.max = P.hp; t.hp = P.hp;
    t.stone = 0; t.fear = 0; t.abCd = abFirst(type); t.cd = 0.8; t.target = null; t.atkTarget = null; t.hitDue = 0;
    t.dmgMul = 1; t.spdMul = 1; t.stun = Math.max(t.stun, 0.4); t.sv += 6;
    ring(t.x, t.y, 30, '#ff7ad8'); burst(t.x, t.y, '#ff7ad8', 16, 1.2);
  },
  spawn(type, team, x, y) {
    const u = mk(type, team, x, y);
    G.units.push(u); G.maxTotal[team] += u.max;
    return u;
  },
  shoot: (kind, u, t, o) => shoot(kind, u, t, o),
  say(u, text, color) { G.fx.push({ kind: 'text', x: u.x, y: u.y - u.r * 2.7, text: L(text), c: color || '#ffffff', life: 1.2, max: 1.2, vy: -24 }); },
  bolt(x0, y0, x1, y1, color) { G.fx.push({ kind: 'bolt', x: x0, y: y0, x1, y1, c: color || '#fff27a', life: 0.3, max: 0.3, seed: Math.random() * 100 }); },
  later(sec, fn) { G.timers.push({ t: sec, fn }); },
};

/* ---------- Flujo del juego ---------- */
function startFight() {
  if (G.phase !== 'place') return;
  if (aliveCount(0) === 0 || aliveCount(1) === 0) { setHint(tr('pista_poner')); return; }
  G.snapshot = G.units.map((u) => ({ type: u.type, team: u.team, x: u.x, y: u.y }));
  G.maxTotal = [0, 0];
  for (const u of G.units) G.maxTotal[u.team] += u.max;
  G.phase = 'fight'; G.paused = false; G.overTimer = 0; G.acc = 0; G.result = null;
  G.projectiles = []; G.fx = []; G.parts = []; G.timers = [];
  $('banner').hidden = true;
  GG.emit('battle:start', G.units);
  syncUI();
}
function restoreSnapshot() {
  if (!G.snapshot) return;
  G.units = G.snapshot.map((s) => mk(s.type, s.team, s.x, s.y));
  G.phase = 'place'; G.paused = false;
  G.projectiles = []; G.fx = []; G.parts = []; G.timers = []; G.shake = 0;
  $('banner').hidden = true;
  syncUI();
}
function endBattle(winner, left) {
  G.phase = 'over'; G.projectiles = []; G.timers = [];
  G.result = { winner, left };
  GG.emit('battle:end', winner, left);
  if (G.mode === 'reto' && winner === 0 && G.level > G.best) {
    G.best = G.level;
    X.store.set('mejor', G.best);
  }
  showBanner();
  syncUI();
}
function showBanner() {
  const { winner, left } = G.result;
  let title, sub, btns;
  if (winner === -1) {
    title = tr('b_empate_t'); sub = tr('b_empate_s');
    btns = [['rematch', tr('b_revancha'), true]];
  } else if (G.mode === 'reto') {
    if (winner === 0) {
      title = tr('b_nivel_t', { n: fmt(G.level) });
      sub = plural('b_nivel_s', left, { left: fmt(left), mejor: fmt(G.best), sig: fmt(G.level + 1), mas: fmt(RETO.oro_por_nivel), oro: fmt(oroJugador(G.level + 1)) });
      btns = [['next', tr('b_siguiente'), true], ['rematch', tr('b_revancha'), false]];
    } else {
      title = tr('b_rival_t');
      sub = tr('b_rival_s');
      btns = [['rematch', tr('b_reintentar'), true], ['restart', tr('b_cero'), false]];
    }
  } else {
    title = tr(winner === 0 ? 'b_azul_t' : 'b_rojo_t');
    sub = plural('b_siguen', left, { left: fmt(left) });
    btns = [['rematch', tr('b_revancha'), true], ['fresh', tr('b_campo'), false]];
  }
  $('bTitle').textContent = title;
  $('bSub').textContent = sub;
  const box = $('bBtns');
  box.textContent = '';
  for (const [act, label, primary] of btns) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (primary ? ' primary' : ''); b.dataset.act = act; b.textContent = label;
    box.appendChild(b);
  }
  $('banner').hidden = false;
}
function newRival() {
  G.units = G.units.filter((u) => u.team === 0);
  genArmy(1, budgetOf(1));
}
function setMode(m) {
  G.mode = m; G.phase = 'place'; G.units = []; G.team = 0; G.level = 1; G.snapshot = null;
  G.projectiles = []; G.fx = []; G.parts = []; G.timers = []; G.paused = false;
  chooseWorld();
  genArmy(1, budgetOf(1));
  $('banner').hidden = true;
  syncUI();
}
function nextLevel() {
  G.level++;
  restoreSnapshot();
  G.units = G.units.filter((u) => u.team === 0);
  genArmy(1, budgetOf(1));
  syncUI();
}

/* ---------- Dibujo ---------- */
function limb(c, px, py, len, w, color, ang) {
  c.save(); c.translate(px, py); c.rotate(ang);
  c.strokeStyle = color; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -len); c.stroke();
  c.restore();
}
function drawJelly(c, type, col, x, y, o) {
  o = o || {};
  const P = UNITS[type], r = P.r * (o.scale || 1), sx = o.sx || 0, dir = o.dir || 1;
  const swingAng = o.swing > 0 ? -1 + (1 - o.swing) * 2.4 : 0.35;
  c.save();
  c.translate(x, y - (o.bob || 0));
  c.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.dead) { c.rotate(o.rot || 0); c.scale(1.2, 0.42); c.translate(0, r * 0.35); }
  else c.scale(1 + sx, 1 - sx * 0.8);

  c.fillStyle = o.flash ? '#ffffff' : col;
  c.beginPath(); c.ellipse(0, -r * 0.2, r * 0.95, r * 1.05, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(0,0,0,.14)';
  c.beginPath(); c.ellipse(0, r * 0.5, r * 0.8, r * 0.38, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,.3)';
  c.beginPath(); c.ellipse(-r * 0.32, -r * 0.78, r * 0.32, r * 0.2, -0.5, 0, TAU); c.fill();

  const ex = dir * r * 0.12, ey = -r * 0.42, er = Math.max(1.6, r * 0.26);
  if (o.dead) {
    c.strokeStyle = '#14251b'; c.lineWidth = Math.max(1, r * 0.12); c.lineCap = 'round';
    for (const k of [-1, 1]) {
      const cx = k * r * 0.36;
      c.beginPath(); c.moveTo(cx - er * 0.6, ey - er * 0.6); c.lineTo(cx + er * 0.6, ey + er * 0.6);
      c.moveTo(cx + er * 0.6, ey - er * 0.6); c.lineTo(cx - er * 0.6, ey + er * 0.6); c.stroke();
    }
  } else {
    c.fillStyle = '#ffffff';
    for (const k of [-1, 1]) { c.beginPath(); c.ellipse(k * r * 0.36 + ex, ey, er, er * 1.15, 0, 0, TAU); c.fill(); }
    c.fillStyle = '#14251b';
    for (const k of [-1, 1]) { c.beginPath(); c.arc(k * r * 0.36 + ex + dir * er * 0.35, ey + er * 0.1, er * 0.5, 0, TAU); c.fill(); }
  }

  c.scale(dir, 1);
  const armed = !o.dead;
