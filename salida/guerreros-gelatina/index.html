    return false;
  }
  const P = UNITS[G.tool], z = zone(team), m = 14;
  if (p.x < z.x0 - m || p.x > z.x1 + m || p.y < z.y0 - m || p.y > z.y1 + m) return false;
  const x = Math.max(z.x0 + P.r, Math.min(z.x1 - P.r, p.x)), y = Math.max(z.y0 + P.r, Math.min(z.y1 - P.r, p.y));
  if (!canPlace(G.tool, team, x, y)) return false;
  G.units.push(mk(G.tool, team, x, y));
  lastPlaced = { x, y };
  burst(x, y, teamColor(team), 4, 0.6);
  updateTray();
  return true;
}
cv.addEventListener('pointerdown', (e) => {
  if (G.phase !== 'place') return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* opcional */ }
  painting = true; lastPlaced = null;
  const p = toWorld(e); G.cursor = p; act(p);
});
cv.addEventListener('pointermove', (e) => {
  const p = toWorld(e); G.cursor = p;
  if (!painting || G.phase !== 'place') return;
  if (G.tool === 'borrar' || !lastPlaced || Math.hypot(p.x - lastPlaced.x, p.y - lastPlaced.y) >= UNITS[G.tool].r * 2 + 4) act(p);
});
const stopPaint = () => { painting = false; };
cv.addEventListener('pointerup', (e) => { stopPaint(); if (e.pointerType && e.pointerType !== 'mouse') G.cursor = null; });
cv.addEventListener('pointercancel', () => { stopPaint(); G.cursor = null; });
cv.addEventListener('pointerleave', () => { stopPaint(); G.cursor = null; });

/* ---------- Botones ---------- */
$('tray').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  G.tool = b.dataset.t; updateTray();
  const tip = G.tool === 'borrar' ? '' : unitTip(G.tool);
  if (tip) setHint(tr('pista_unidad', { nombre: unitName(G.tool), tip })); else syncUI();
});
$('mReto').addEventListener('click', () => { if (G.mode !== 'reto') setMode('reto'); });
$('mLibre').addEventListener('click', () => { if (G.mode !== 'libre') setMode('libre'); });
$('tBlue').addEventListener('click', () => { G.team = 0; syncUI(); });
$('tRed').addEventListener('click', () => { G.team = 1; syncUI(); });
$('oro').addEventListener('change', (e) => { G.budgetLibre = Number(e.target.value) || 1000; G.units = []; genArmy(1, budgetOf(1)); syncUI(); });
$('btnClear').addEventListener('click', () => {
  const team = editableTeam();
  G.units = G.units.filter((u) => u.team !== team); updateTray();
});
$('btnRandom').addEventListener('click', () => { newRival(); updateTray(); });
$('btnFight').addEventListener('click', startFight);
$('btnPause').addEventListener('click', () => { G.paused = !G.paused; syncUI(); });
$('btnSpeed').addEventListener('click', () => { G.speedIdx = (G.speedIdx + 1) % SPEEDS.length; syncUI(); });
$('btnStop').addEventListener('click', restoreSnapshot);
$('bBtns').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'rematch') restoreSnapshot();
  else if (a === 'next') nextLevel();
  else if (a === 'restart') setMode('reto');
  else if (a === 'fresh') setMode('libre');
});
document.addEventListener('keydown', (e) => {
  if (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key >= '1' && e.key <= '9' && G.phase === 'place' && ORDER[Number(e.key) - 1]) { G.tool = ORDER[Number(e.key) - 1]; updateTray(); }
  else if (e.key === 'b' || e.key === 'B') { if (G.phase === 'place') { G.tool = 'borrar'; updateTray(); } }
  else if (e.key === 'Enter' && G.phase === 'place' && document.activeElement === document.body) startFight();
  else if (e.key === 'p' || e.key === 'P') { if (G.phase === 'fight') { G.paused = !G.paused; syncUI(); } }
});

/* ---------- Bucle ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  G.rt += dt;
  GG.emit('frame', dt);
  if (G.phase === 'fight' && !G.paused) {
    G.acc += dt * SPEEDS[G.speedIdx];
    let n = 0;
    while (G.acc >= 1 / 60 && n < 10 && G.phase === 'fight') { step(1 / 60); G.acc -= 1 / 60; n++; }
    if (n >= 10) G.acc = 0;
  } else if (G.phase !== 'fight') {
    updateFx(dt);
    for (const u of G.units) { if (u.sv || u.sx) { u.sv += (-110 * u.sx - 8 * u.sv) * dt; u.sx += u.sv * dt; } }
  }
  render();
  updateHud();
  requestAnimationFrame(frame);
}

/* ---------- Arranque ----------
   Se espera a DOMContentLoaded para que los <script> de paquetes puestos después de este alcancen a registrarse. */
function boot() {
  for (const p of GG.patches) if (!p.done) applyPatch(p);
  GG.booted = true;
  G.best = Number(X.store.get('mejor', 0)) || 0;
  if (!G.best) { try { G.best = Number(localStorage.getItem('gg-mejor')) || 0; } catch (e) { /* versiones anteriores guardaban aquí el mejor nivel */ } }
  readTheme();
  applyStatic();
  fillOro();
  X.ui.langButton(document.querySelector('.head-r'));   // selector de idioma (solo aparece si el juego tiene más de uno)
  X.onLang(onLanguage);
  buildTray();
  updatePacksLine();
  setMode('reto');
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
  else window.addEventListener('resize', resize);
  if (window.MutationObserver) new MutationObserver(() => { readTheme(); drawIcons(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const onTheme = () => { readTheme(); drawIcons(); };
    if (mq.addEventListener) mq.addEventListener('change', onTheme);
  }
  GG.emit('boot', GG);
  requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>

<script id="pack-leyendas">
/* Pack Leyendas 1.1.0: paquete de ejemplo (DLC) construido solo con la API abierta de arriba.
   Personajes de la mitología, el folclor y la literatura de dominio público. Para quitarlo, borra este <script>.
   Sus textos (nombre, ayuda y frase de cada poder) están en juego.json → textos, con las claves u_<id>, u_<id>_tip y u_<id>_dice;
   para traducirlo a otro idioma basta añadir ese idioma allí. El name de cada unidad es solo el respaldo si falta la clave. */
(() => {

const units = {};

const cap = (c, r, from, to, fill) => { c.fillStyle = fill; c.beginPath(); c.ellipse(0, -r * 0.2, r * 0.99, r * 1.09, 0, Math.PI * from, Math.PI * to); c.closePath(); c.fill(); };
const beard = (c, r, fill, len) => { c.fillStyle = fill; c.beginPath(); c.moveTo(-r * 0.8, -r * 0.1); c.quadraticCurveTo(0, r * len, r * 0.8, -r * 0.1); c.quadraticCurveTo(0, r * 0.1, -r * 0.8, -r * 0.1); c.fill(); };

/* Rana: solo existe como resultado de la polimorfia de Merlín (hidden: no aparece en la bandeja). */
units.rana = {
  name: 'Rana', hidden: true, cost: 0, hp: 14, speed: 84, r: 6, range: 8, dmg: 2, cd: 1.2, kind: 'melee', kb: 10,
  draw(c, col, r, o, h) {
    c.fillStyle = o.flash ? '#ffffff' : '#58b947';
    c.beginPath(); c.ellipse(0, -r * 0.2, r * 0.96, r * 1.06, 0, 0, h.TAU); c.fill();
    c.strokeStyle = col; c.lineWidth = Math.max(1, r * 0.22);
    c.beginPath(); c.ellipse(0, -r * 0.2, r * 0.9, r * 1.0, 0, 0, h.TAU); c.stroke();
    if (o.dead) { c.strokeStyle = '#14251b'; c.lineWidth = Math.max(1, r * 0.14); c.beginPath(); c.moveTo(-r * 0.8, -r * 1.0); c.lineTo(-r * 0.2, -r * 1.0); c.moveTo(r * 0.2, -r * 1.0); c.lineTo(r * 0.8, -r * 1.0); c.stroke(); return; }
    for (const k of [-1, 1]) {
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(k * r * 0.5, -r * 1.1, r * 0.42, 0, h.TAU); c.fill();
      c.fillStyle = '#14251b'; c.beginPath(); c.arc(k * r * 0.5 + r * 0.1, -r * 1.1, r * 0.18, 0, h.TAU); c.fill();
    }
  },
};

    cast(u, api) {
      api.say(u, GG.t('u_llorona_dice'), '#a9dcff');
      api.ring(u.x, u.y, 160, '#a9dcff');
      for (const t of api.enemies(u, 160)) { api.fear(t, 4, u); api.hurt(t, 14, u, 0); }
    },
  },
  draw(c, col, r, o, h) {
    const w = Math.sin(h.rt * 3) * r * 0.08;
    c.fillStyle = '#f3f6ff';                                            // vestido blanco que ondea
    c.beginPath(); c.moveTo(-r * 0.8, -r * 0.05); c.lineTo(-r * 1.25, r * 1.05 + w);
    for (let i = 1; i <= 5; i++) c.lineTo(-r * 1.25 + (r * 2.5 * i) / 5, r * (1.05 + (i % 2 ? 0.16 : -0.02)) + (i % 2 ? -w : w));
    c.lineTo(r * 0.8, -r * 0.05); c.closePath(); c.fill();
    cap(c, r, 1.17, 1.83, '#16161e');                                   // pelo negro y largo
    c.fillStyle = '#16161e';
    for (const k of [-1, 1]) {
      c.beginPath(); c.moveTo(k * r * 0.8, -r * 0.95); c.quadraticCurveTo(k * r * 1.3, -r * 0.2, k * r * 1.05, r * 0.75); c.lineTo(k * r * 0.72, r * 0.6);
      c.quadraticCurveTo(k * r * 0.95, -r * 0.2, k * r * 0.55, -r * 0.9); c.closePath(); c.fill();
    }
    c.fillStyle = '#8fd3ff';                                            // lágrimas
    for (const k of [-1, 1]) { const s = (h.rt * 1.5 + (k + 1) * 0.25) % 1; c.beginPath(); c.arc(k * r * 0.36 + r * 0.12, -r * 0.3 + s * r * 0.9, r * 0.08, 0, h.TAU); c.fill(); }
  },
});

units.dracula = leyenda({
  name: 'Drácula', cost: 650, hp: 420, speed: 58, r: 12, range: 17, dmg: 26, cd: 0.85, kind: 'melee', kb: 130,
  lifesteal: 0.6,
  iconScale: 0.9,
  ability: {
    cd: 6, first: 2.5,
    ready: (u, api) => api.enemies(u, 90).length > 0,
    cast(u, api) {
      api.say(u, GG.t('u_dracula_dice'), '#ff5a6e');
      api.ring(u.x, u.y, 95, '#b3122a');
      for (const t of api.enemies(u, 95).slice(0, 6)) api.hurt(t, 28, u, 140); // la curación sale del robo de vida
    },
  },
  draw(c, col, r, o, h) {
    c.fillStyle = '#8a1020';                                            // capa roja y cuello alto
    c.beginPath(); c.moveTo(-r * 0.6, -r * 0.8); c.lineTo(-r * 1.6, r * 0.8); c.lineTo(-r * 0.4, r * 0.55); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-r * 0.95, -r * 0.5); c.lineTo(-r * 1.3, -r * 1.35); c.lineTo(-r * 0.3, -r * 0.35); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(r * 0.7, -r * 0.5); c.lineTo(r * 1.05, -r * 1.3); c.lineTo(r * 0.15, -r * 0.3); c.closePath(); c.fill();
    cap(c, r, 1.18, 1.82, '#14141a');                                   // pelo engominado con pico de viuda
    c.fillStyle = '#14141a'; c.beginPath(); c.moveTo(-r * 0.34, -r * 0.84); c.lineTo(0, -r * 0.56); c.lineTo(r * 0.34, -r * 0.84); c.closePath(); c.fill();
    c.strokeStyle = '#14251b'; c.lineWidth = Math.max(1, r * 0.07); c.lineCap = 'round';
    c.beginPath(); c.moveTo(r * 0.12, 0); c.lineTo(r * 0.62, 0); c.stroke();
    c.fillStyle = '#ffffff';                                            // colmillos
    for (const x of [0.26, 0.5]) { c.beginPath(); c.moveTo((x - 0.06) * r, 0); c.lineTo((x + 0.06) * r, 0); c.lineTo(x * r, r * 0.24); c.closePath(); c.fill(); }
    if (h.armed) {                                                      // zarpazo
      c.save(); c.translate(r * 0.85, -r * 0.1); c.rotate(h.swingAng);
      c.strokeStyle = '#e9e3ef'; c.lineWidth = r * 0.3; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r * 1.0); c.stroke();
      c.strokeStyle = '#c2b8cc'; c.lineWidth = Math.max(1, r * 0.08);
      for (const x of [-0.14, 0, 0.14]) { c.beginPath(); c.moveTo(x * r, -r * 1.0); c.lineTo(x * r * 1.5, -r * 1.45); c.stroke(); }
      c.restore();
    }
  },
});

GG.registerPack({ id: 'leyendas', name: 'Pack Leyendas', version: '1.1.0', units });
})();
</script>

<script id="pack-audio">
/* Pack Audio 1.0.0 · sonido para Guerreros Gelatina sin tocar el núcleo del juego.
   Solo usa la API abierta (eventos y acciones de api.*) y el motor común GGX. Si GGX no está, no hace nada.
   Todo suena sintetizado (WebAudio), arranca con el primer toque del jugador y se puede silenciar con el botón del encabezado. */
(function () {
  'use strict';
  const gg = window.GuerrerosGelatina, X = window.GGX;
  if (!gg || !X) return;

  gg.registerPack({
    id: 'audio', name: 'Audio', version: '1.0.0',
    setup(g) {
      const api = g.api, S = api.state;

      // Eventos de la batalla
      g.on('battle:start', () => X.sfx('horn', 0));
      g.on('battle:end', (winner) => X.sfx(winner === -1 ? 'error' : winner === 1 && S.mode === 'reto' ? 'lose' : 'win', 0));
      g.on('unit:hit', () => X.sfx('hit', 70));
      g.on('unit:die', () => X.sfx('hurt', 90));

      // Explosiones y pisotones: el núcleo los marca con una sacudida de pantalla
      let shake = 0;
      g.on('tick', () => { if (S.shake > shake + 3.5) X.sfx('boom', 120); shake = S.shake; });

      // Poderes: se envuelven las acciones de la API que usan las Leyendas
      const wrap = (name, sound, min) => {
        const f = api[name];
        if (typeof f !== 'function') return;
        api[name] = function () { X.sfx(sound, min); return f.apply(this, arguments); };
      };
      wrap('bolt', 'zap', 100);
      wrap('stone', 'land', 80);
      wrap('fear', 'whoosh', 150);
      wrap('revive', 'heal', 150);
      wrap('morph', 'merge', 80);
      wrap('heal', 'heal', 250);
      wrap('shoot', 'whoosh', 130);

      // Interfaz: colocar, borrar y botones
      const cv = document.getElementById('cv');
      if (cv) {
        const watch = (e) => {
          if (S.phase !== 'place') return;
          if (e.type === 'pointermove' && e.buttons === 0) return; // pasar el ratón por encima no cuenta
          const before = S.units.length, tool = S.tool;
          setTimeout(() => {
            const after = S.units.length;
            if (after > before) X.sfx('pop', 35);
            else if (after < before) X.sfx('click', 35);
            else if (e.type === 'pointerdown' && tool !== 'borrar') X.sfx('error', 250); // no cabe o no alcanza el oro
          }, 0);
        };
        cv.addEventListener('pointerdown', watch, true);
        cv.addEventListener('pointermove', watch, true);
      }
      document.addEventListener('click', (e) => {
        const b = e.target.closest && e.target.closest('button');
        if (!b || b.classList.contains('ggx-btn') || b.id === 'btnFight') return;
        X.sfx('click', 30);
      }, true);

      // Botón de silencio junto al selector de modo
      const where = document.querySelector('.head-r');
      if (where) X.ui.muteButton(where);
    },
  });
})();
</script>

<script id="pack-acabado">
/* Pack Acabado 1.0.0 · el acabado de Guerreros Gelatina con el motor común: accesibilidad, efectos, música que se compone sola y el sello de la marca.
   Solo usa la API abierta (eventos y api.*) y los módulos del motor (GGX.a11y, GGX.fx, GGX.music, GGX.marca). Si falta alguno de los cuatro, no hace
   nada y el juego sigue igual. Para quitarlo, borra «acabado» de "paquetes" y los cuatro módulos de "motor" en juego.json. */
(function () {
  'use strict';
  const gg = window.GuerrerosGelatina, GGX = window.GGX;
  if (!gg || !GGX || !GGX.a11y || !GGX.fx || !GGX.music || !GGX.marca) return;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  gg.registerPack({
    id: 'acabado', name: 'Acabado', version: '1.0.0',
    setup(g) {
      const S = g.api.state, t = (k, v) => g.t(k, v);

      /* ---- Accesibilidad: botón con «menos movimiento» y «alto contraste», y avisos para el lector de pantalla ---- */
      const donde = document.querySelector('.head-r');
      if (donde) GGX.ui.accessButton(donde);
      g.on('battle:start', () => GGX.a11y.announce(t('a11y_inicio')));
      g.on('battle:end', () => setTimeout(() => {          // el aviso de fin se arma justo después de este evento
        const ti = $('bTitle'), su = $('bSub');
        const titulo = ti ? ti.textContent : '';
        GGX.a11y.announce(titulo + (/[.!?。！？]$/.test(titulo) ? ' ' : '. ') + (su ? su.textContent : ''));
      }, 40));

      // Con «alto contraste» el bando también se distingue por la forma (círculo = azul, rombo = rojo), no solo por el color.
      const marcasDeBando = (c) => {
        for (const u of S.units) {
          if (u.dead) continue;
          const x = u.x, y = u.y + u.r * 0.6, k = 5;
          c.beginPath();
          if (u.team === 0) c.arc(x, y, k, 0, S.TAU || Math.PI * 2);
          else { c.moveTo(x, y - k - 1); c.lineTo(x + k + 1, y); c.lineTo(x, y + k + 1); c.lineTo(x - k - 1, y); c.closePath(); }
          c.fillStyle = '#ffffff'; c.fill();
          c.lineWidth = 2; c.strokeStyle = '#14251b'; c.stroke();
        }
      };

      /* ---- Efectos: chispas al caer un guerrero, confeti al ganar, textos flotantes ---- */
      let ventana = 0, chispas = 0;
      g.on('unit:die', (u) => {
        const ahora = performance.now();
        if (ahora - ventana > 120) { ventana = ahora; chispas = 0; }
        if (chispas++ >= 5) return;                         // un derrumbe de cien guerreros no debe ahogar el cuadro
        GGX.fx.burst(u.x, u.y - u.r * 0.4, { n: 7, color: ['#ffffff', '#ffd24a'], vel: 95, vida: 0.45, tam: 2.6 });
      });
      g.on('battle:start', () => { GGX.fx.clear(); GGX.fx.text(S.W / 2, S.H * 0.2, t('fx_pelea'), { color: '#ffffff', px: 36 }); });
      g.on('battle:end', (winner) => {
        if (winner === -1) return;
        const reto = S.mode === 'reto';
        if (reto && winner !== 0) return;                   // perder en Reto no se celebra
        GGX.fx.preset('confeti', S.W * 0.3, S.H * 0.28);
        GGX.fx.preset('confeti', S.W * 0.7, S.H * 0.28);
        GGX.fx.flash('#ffffff', 180, 0.22);
        if (reto) {
          GGX.fx.text(S.W / 2, S.H * 0.4, t(S.level > S.best ? 'fx_record' : 'fx_nivel', { n: GGX.num(S.level) }), { color: '#ffe66b', px: 38 });
        }
      });
      g.on('frame', (dt) => GGX.fx.update(dt));
      g.on('draw', (c, W, H) => {
        GGX.fx.draw(c, W, H);
        if (GGX.a11y.highContrast()) marcasDeBando(c);
      });

      /* ---- Música: se compone sola y se pone más intensa cuanto más reñida va la batalla ---- */
      let suena = false, intensidad = 0.25, reloj = 0;
      const arrancar = () => {
        if (suena) return;
        suena = true;
        for (const ev of ['click', 'keydown', 'pointerup', 'touchend']) window.removeEventListener(ev, arrancar, true);
        GGX.music.start({ animo: 'aventura', semilla: 1120, intensidad });
      };
      for (const ev of ['click', 'keydown', 'pointerup', 'touchend']) window.addEventListener(ev, arrancar, true);   // el navegador solo deja sonar tras un gesto
      const vida = (equipo) => {
        let hp = 0;
        for (const u of S.units) if (!u.dead && u.team === equipo) hp += u.hp;
        return clamp(hp / (S.maxTotal[equipo] || 1), 0, 1);
      };
      g.on('frame', (dt) => {
        reloj += dt;
        if (reloj < 0.25) return;
        reloj = 0;
        let i = 0.25;                                       // colocando
        if (S.phase === 'fight') i = S.paused ? 0.15 : 0.4 + 0.6 * (1 - Math.min(vida(0), vida(1)));
        if (Math.abs(i - intensidad) < 0.04) return;
        intensidad = i;
        if (suena) GGX.music.intensidad(i);
      });

      /* ---- Marca: el sello abre la primera batalla de la visita y el distintivo firma el pie de página ---- */
      const pelear = $('btnFight');
      let sellado = false;
      const hayDosBandos = () => {
        let a = 0, r = 0;
        for (const u of S.units) if (!u.dead) { if (u.team === 0) a++; else r++; }
        return a > 0 && r > 0;
      };
      const conSello = (reanudar) => { sellado = true; GGX.marca.sello({ al_terminar: reanudar }); };
      if (pelear) {
        pelear.addEventListener('click', (e) => {
          if (sellado || S.phase !== 'place' || !hayDosBandos()) return;
          e.stopImmediatePropagation(); e.preventDefault();
          conSello(() => { if (S.phase === 'place') pelear.click(); });
        }, true);
        window.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' || sellado || S.phase !== 'place' || document.activeElement !== document.body || !hayDosBandos()) return;
          e.stopImmediatePropagation(); e.preventDefault();
          conSello(() => { if (S.phase === 'place') pelear.click(); });
        }, true);
      }
      const pie = $('packs');
      if (pie && pie.parentNode) {
        const firma = document.createElement('p');
        firma.className = 'foot'; firma.id = 'firma';
        pie.parentNode.insertBefore(firma, pie.nextSibling);
        GGX.marca.distintivo(firma, { texto: true });
      }
    },
  });
})();
</script>
