<style>
/* Plantilla «arena» (sandbox de materiales que caen): dibujas con arena, agua, piedra y gelatina; cada material se comporta distinto y las combinaciones
   desbloquean materiales nuevos. El objetivo es descubrir todo.
   Lo que conserva del andamio:
   · colores como variables, con tema claro y oscuro (el fondo del body siempre explícito)
   · todo texto visible sale de X.t('clave') y se rellena de nuevo con X.onLang (los textos viven en juego.json → textos, en cada idioma)
   · números con X.num; fuente del lienzo con FONT() (trae la tipografía china del sistema)
   · el estado para las pruebas se expone en window.__arena
   · sin conexiones externas, sin Google Fonts: la fábrica incrusta las tipografías */
:root {
  --bg: #f1f5ff; --surface: #ffffff; --ink: #15203b; --ink-soft: #4a5a7e; --line: #cfd9f0; --accent: #2f6bdc; --accent-ink: #ffffff; --focus: #1b5fe0; --ok: #1f8f50;
  --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "WenQuanYi Micro Hei";
  --font-display: 'Fredoka', var(--cjk), 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito Sans', var(--cjk), system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b1020; --surface: #141b33; --ink: #e6ecff; --ink-soft: #9fb0d9; --line: #29345c; --focus: #8db0ff; --ok: #5fd08f; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0b1020; --surface: #141b33; --ink: #e6ecff; --ink-soft: #9fb0d9; --line: #29345c; --focus: #8db0ff; --ok: #5fd08f; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); min-height: 100vh; }
.app { box-sizing: border-box; max-width: 760px; margin: 0 auto; padding-block: 12px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h1 { margin: 0; font: 700 1.5rem/1.1 var(--font-display); text-wrap: balance; }
.tools { display: flex; gap: 8px; }
canvas { display: block; width: 100%; height: auto; margin-top: 12px; border-radius: 18px; background: #1a2038; border: 2px solid var(--line); touch-action: none; cursor: crosshair; image-rendering: pixelated; }
canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.paleta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.mat { display: inline-flex; align-items: center; gap: 8px; font: 700 .95rem var(--font-display); border: 2px solid var(--line); border-radius: 12px; padding: .45em .8em; background: var(--surface); color: var(--ink); cursor: pointer; }
.mat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.mat:disabled { opacity: .5; cursor: not-allowed; }
.mat:focus-visible, .btn:focus-visible, input[type=range]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muestra { width: 16px; height: 16px; border-radius: 5px; border: 1px solid rgba(0,0,0,.25); }
.radio { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); font-size: .9rem; }
.btn { font: 700 .95rem var(--font-display); border: 0; border-radius: 12px; padding: .5em 1.1em; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.pista { margin: 10px 0 0; color: var(--ink-soft); font-size: .95rem; line-height: 1.35; min-height: 1.35em; }
.desc { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .92rem; }
.desc li { color: var(--ink-soft); }
.desc li[data-ok="1"] { color: var(--ok); font-weight: 700; }
.ayuda { margin: 8px 0 0; color: var(--ink-soft); font-size: .85rem; line-height: 1.35; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>

<div class="app">
  <header>
    <h1 id="titulo"></h1>
    <div class="tools" id="tools"></div>
  </header>
  <canvas id="cv" width="640" height="400" role="img" tabindex="0"></canvas>
  <div class="paleta" id="paleta"></div>
  <p class="pista" id="pista"></p>
  <ul class="desc" id="desc"></ul>
  <p class="ayuda" id="ayuda"></p>
  <p class="sr" id="aviso" role="status" aria-live="polite"></p>
</div>

<script>
const X = window.GGX, P = (window.JUEGO && window.JUEGO.parametros) || {};
const $ = (id) => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const BOT = !!(X.bots && X.bots.activo);
const FONT = (px, w) => w + ' ' + px + 'px Fredoka, ' + X.cjk + ', "Trebuchet MS", sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---- el mundo: una rejilla de celdas con reglas locales, determinista (el azar sale de GGX.rng con semilla) -----------------------------------
const GW = P.ancho || 160, GH = P.alto || 100, N = GW * GH, CELDA = 640 / GW, TICKS_S = 60, MS_TICK = 1000 / TICKS_S;
const VACIO = 0, ARENA = 1, AGUA = 2, PIEDRA = 3, GELATINA = 4, BARRO = 5;
const NOMBRE = ['', 'arena', 'agua', 'piedra', 'gelatina', 'barro'];
const COLOR = [[26, 32, 56], [232, 200, 106], [59, 143, 224], [122, 127, 147], [74, 213, 138], [138, 90, 53]];
const MATERIALES = ['arena', 'agua', 'piedra', 'gelatina'];                 // los que el jugador puede poner (el barro nace de mezclar)
const DESCUBRIMIENTOS = ['montana', 'barro', 'estanque', 'isla'];            // en orden; cada uno desbloquea el siguiente material
const DESBLOQUEA = { montana: 'agua', barro: 'piedra', estanque: 'gelatina' };
const U = P.umbrales || { montana: 20, barro: 40, estanque: 12, isla: 16 };
const SOSTENER = P.sostener || 90;               // ticks seguidos (1,5 s) que debe mantenerse una condición para contar como descubrimiento
const cel = new Uint8Array(N), sello = new Uint32Array(N);
let tick = 0, rnd = X.rng(1);
const M = { desbloqueados: ['arena'], descubiertos: [], cuando: {}, racha: {}, colocadas: { arena: 0, agua: 0, piedra: 0, gelatina: 0 }, borradas: 0, colocadasTotal: 0 };

function mover(i, j) { const t = cel[i]; cel[i] = cel[j]; cel[j] = t; sello[i] = tick; sello[j] = tick; }
function libre(i) { return cel[i] === VACIO; }
function cae(x, y, i) {                      // arena, agua y gelatina caen; devuelve true si se movió
  const j = i + GW;
  const t = cel[i];
  if (cel[j] === VACIO || (t === ARENA && cel[j] === AGUA)) { mover(i, j); return true; }
  const d = rnd() < 0.5 ? -1 : 1;
  for (const s of [d, -d]) {
    const nx = x + s;
    if (nx < 0 || nx >= GW) continue;
    const k = j + s;
    if (cel[k] === VACIO || (t === ARENA && cel[k] === AGUA)) { mover(i, k); return true; }
  }
  return false;
}
function pasoMundo() {
  tick++;
  const ida = (tick & 1) === 0;
  for (let y = GH - 2; y >= 0; y--) {
    for (let k = 0; k < GW; k++) {
      const x = ida ? k : GW - 1 - k, i = y * GW + x, t = cel[i];
      if (t === VACIO || t === PIEDRA || sello[i] === tick) continue;
      if (t === ARENA) {
        if (cae(x, y, i)) continue;
        // mojada: la arena junto al agua se vuelve barro
        const j = i + GW;
        if ((cel[j] === AGUA || (x > 0 && cel[i - 1] === AGUA) || (x < GW - 1 && cel[i + 1] === AGUA)) && rnd() < 0.04) cel[i] = BARRO;
      } else if (t === AGUA) {
        if (cae(x, y, i)) continue;
        const d = rnd() < 0.5 ? -1 : 1;
        for (const s of [d, -d]) {
          const nx = x + s;
          if (nx >= 0 && nx < GW && cel[i + s] === VACIO) { mover(i, i + s); break; }
        }
      } else if (t === GELATINA) {                                 // viscosa y más ligera que el agua: cae despacio y flota encima
        if ((tick & 1) === 0) { if (cel[i + GW] === VACIO) mover(i, i + GW); else if (cel[i + GW] !== AGUA) cae(x, y, i); }
        if (sello[i] !== tick && cel[i + GW] === AGUA && rnd() < 0.15) {
          const s = rnd() < 0.5 ? -1 : 1, nx = x + s;
          if (nx >= 0 && nx < GW && cel[i + s] === VACIO) mover(i, i + s);
        }
      } else if (t === BARRO) {                                    // pesado y pegajoso: solo cae recto y despacio
        if (tick % 3 === 0 && cel[i + GW] === VACIO) mover(i, i + GW);
      }
    }
  }
}
function poner(nombre, cx, cy, r) {
  const t = NOMBRE.indexOf(nombre);
  let n = 0;
  for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
    if (x < 0 || x >= GW || y < 0 || y >= GH) continue;
    if ((x - cx) * (x - cx) + (y - cy) * (y - cy) > r * r + r * 0.5) continue;
    const i = y * GW + x;
    if (cel[i] === VACIO) { cel[i] = t; n++; }
  }
  M.colocadas[nombre] += n; M.colocadasTotal += n;
  return n;
}
function borrar(cx, cy, r) {
  let n = 0;
  for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
    if (x < 0 || x >= GW || y < 0 || y >= GH) continue;
    if ((x - cx) * (x - cx) + (y - cy) * (y - cy) > r * r + r * 0.5) continue;
    const i = y * GW + x;
    if (cel[i] !== VACIO) { cel[i] = VACIO; n++; }
  }
  M.borradas += n;
  return n;
}
function medidas() {
  const c = [0, 0, 0, 0, 0, 0], sol = new Array(GW).fill(0), agua = new Array(GW).fill(0), cima = new Array(GW).fill(-1);
  let isla = 0;
  for (let x = 0; x < GW; x++) {
    for (let y = GH - 1; y >= 0; y--) {
      const t = cel[y * GW + x];
      c[t]++;
      if (t === ARENA || t === BARRO) sol[x]++;
      if (t === AGUA) { agua[x]++; cima[x] = y; }
      if (t === GELATINA && y + 1 < GH && cel[(y + 1) * GW + x] === AGUA) isla++;
    }
  }
  // montaña: un pico que sobresale de sus dos lados (a 20 celdas); llenar el lienzo de arena no cuenta
  let montana = 0;
  for (let x = 20; x < GW - 20; x++) montana = Math.max(montana, sol[x] - Math.max(sol[x - 20], sol[x + 20]));
  // estanque: agua profunda contenida, o sea que a la altura de su superficie tiene piedra a ambos lados; inundar el lienzo no cuenta
  let estanque = 0;
  for (let x = 0; x < GW; x++) {
    if (agua[x] <= estanque) continue;
    const f = cima[x] * GW;
    let a = x - 1; while (a >= 0 && cel[f + a] === AGUA) a--;
    let b = x + 1; while (b < GW && cel[f + b] === AGUA) b++;
    if (a >= 0 && b < GW && cel[f + a] === PIEDRA && cel[f + b] === PIEDRA) estanque = agua[x];
  }
  return { conteos: { arena: c[ARENA], agua: c[AGUA], piedra: c[PIEDRA], gelatina: c[GELATINA], barro: c[BARRO] }, montana, estanque, isla };
}
function revisarDescubrimientos() {
  const m = medidas();
  const logrado = { montana: m.montana >= U.montana, barro: m.conteos.barro >= U.barro, estanque: m.estanque >= U.estanque, isla: m.isla >= U.isla };
  const nuevos = [];
  for (const d of DESCUBRIMIENTOS) {
    if (M.descubiertos.indexOf(d) >= 0) continue;
    M.racha[d] = logrado[d] ? (M.racha[d] || 0) + 5 : 0;                      // se revisa cada 5 ticks; tiene que sostenerse, no basta un instante
    if (M.racha[d] >= SOSTENER) {
      M.descubiertos.push(d); M.cuando[d] = tick; nuevos.push(d);
      const u = DESBLOQUEA[d];
      if (u && M.desbloqueados.indexOf(u) < 0) M.desbloqueados.push(u);
    }
  }
  return nuevos;
}
function reiniciarMundo(semilla) {
  cel.fill(0); sello.fill(0); tick = 0; rnd = X.rng(semilla >>> 0);
  M.desbloqueados = ['arena']; M.descubiertos = []; M.cuando = {}; M.racha = {}; M.colocadas = { arena: 0, agua: 0, piedra: 0, gelatina: 0 }; M.borradas = 0; M.colocadasTotal = 0;
}
function avanzarTicks(n) {
  for (let i = 0; i < n; i++) { pasoMundo(); if (tick % 5 === 0) novedades(revisarDescubrimientos()); }
}

// ---- la partida (interfaz de una persona) -----------------------------------------------------------------------------------------------------
const S = { mat: 'arena', radio: 3, cx: GW >> 1, cy: 8, vertiendo: false, apretado: false, aviso: '' };
function anunciar(t) { S.aviso = t; $('aviso').textContent = t; }
function guardar() { X.store.set('arena_prog', { d: M.descubiertos.slice() }); }
function restaurar() {
  const p = X.store.get('arena_prog', null);
  if (!p || !Array.isArray(p.d)) return;
  for (const d of DESCUBRIMIENTOS) if (p.d.indexOf(d) >= 0) { M.descubiertos.push(d); M.cuando[d] = 0; if (DESBLOQUEA[d] && M.desbloqueados.indexOf(DESBLOQUEA[d]) < 0) M.desbloqueados.push(DESBLOQUEA[d]); }
}
function novedades(nuevos) {
  if (!nuevos.length || BOT) return;
  for (const d of nuevos) {
    X.sfx('win', 0);
    anunciar(X.t('descubierto', { nombre: X.t('d_' + d) }) + (DESBLOQUEA[d] ? ' · ' + X.t('desbloqueo', { nombre: X.t('material_' + DESBLOQUEA[d]) }) : ''));
  }
  if (M.descubiertos.length === DESCUBRIMIENTOS.length) anunciar(X.t('todo'));
  guardar(); interfaz();
}
function interfaz() {
  const pal = $('paleta');
  pal.innerHTML = '';
  for (const m of MATERIALES) {
    const b = document.createElement('button');
    const abierto = M.desbloqueados.indexOf(m) >= 0;
    b.type = 'button'; b.className = 'mat'; b.dataset.mat = m; b.disabled = !abierto;
    b.setAttribute('aria-pressed', String(S.mat === m && abierto));
    const c = COLOR[NOMBRE.indexOf(m)];
    b.innerHTML = '<span class="muestra" style="background:rgb(' + c.join(',') + ')"></span>';
    b.appendChild(document.createTextNode(X.t('material_' + m) + (abierto ? '' : ' · ' + X.t('bloqueado'))));
    b.addEventListener('click', () => { S.mat = m; X.sfx('click', 0); interfaz(); });
    pal.appendChild(b);
  }
  const bb = document.createElement('button'); bb.type = 'button'; bb.className = 'mat'; bb.dataset.mat = 'borrar'; bb.textContent = X.t('borrar');
  bb.setAttribute('aria-pressed', String(S.mat === 'borrar')); bb.addEventListener('click', () => { S.mat = 'borrar'; X.sfx('click', 0); interfaz(); }); pal.appendChild(bb);
  const rl = document.createElement('label'); rl.className = 'radio'; rl.textContent = X.t('radio') + ' ';
  const rg = document.createElement('input'); rg.type = 'range'; rg.min = '1'; rg.max = '8'; rg.value = String(S.radio); rg.setAttribute('aria-label', X.t('radio'));
  rg.addEventListener('input', () => { S.radio = Number(rg.value); }); rl.appendChild(rg); pal.appendChild(rl);
  const lb = document.createElement('button'); lb.type = 'button'; lb.className = 'btn'; lb.id = 'btnLimpiar'; lb.textContent = X.t('limpiar');
  lb.addEventListener('click', () => { limpiar(); }); pal.appendChild(lb);
  const sig = DESCUBRIMIENTOS.find((d) => M.descubiertos.indexOf(d) < 0);
  $('pista').textContent = sig ? X.t('pista_' + sig) : X.t('todo');
  $('desc').innerHTML = '';
  for (const d of DESCUBRIMIENTOS) {
    const li = document.createElement('li'); const ok = M.descubiertos.indexOf(d) >= 0;
    li.dataset.ok = ok ? '1' : '0'; li.textContent = (ok ? '✓ ' : '· ') + (ok ? X.t('d_' + d) : '???'); $('desc').appendChild(li);
  }
}
function limpiar() { let n = 0; for (let i = 0; i < N; i++) if (cel[i]) n++; M.borradas += n; cel.fill(0); sello.fill(0); X.sfx('pop', 0); anunciar(X.t('limpio')); }
function textos() {
  document.title = X.t('titulo'); $('titulo').textContent = X.t('titulo'); cv.setAttribute('aria-label', X.t('aria_juego')); $('ayuda').textContent = X.t('ayuda'); interfaz();
}
function aplicarPincel() {
  if (S.mat === 'borrar') borrar(S.cx, S.cy, S.radio);
  else if (M.desbloqueados.indexOf(S.mat) >= 0) poner(S.mat, S.cx, S.cy, S.radio);
}
function celdaDe(e) { const r = cv.getBoundingClientRect(); return [clamp(Math.floor((e.clientX - r.left) / r.width * GW), 0, GW - 1), clamp(Math.floor((e.clientY - r.top) / r.height * GH), 0, GH - 1)]; }
cv.addEventListener('pointerdown', (e) => { S.apretado = true; [S.cx, S.cy] = celdaDe(e); cv.setPointerCapture(e.pointerId); aplicarPincel(); e.preventDefault(); });
cv.addEventListener('pointermove', (e) => { if (S.apretado) { [S.cx, S.cy] = celdaDe(e); aplicarPincel(); } });
cv.addEventListener('pointerup', () => { S.apretado = false; });
cv.addEventListener('pointercancel', () => { S.apretado = false; });
addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT')) return;
  const paso = e.shiftKey ? 1 : 4;
  if (e.code === 'ArrowLeft') { S.cx = clamp(S.cx - paso, 0, GW - 1); e.preventDefault(); }
  else if (e.code === 'ArrowRight') { S.cx = clamp(S.cx + paso, 0, GW - 1); e.preventDefault(); }
  else if (e.code === 'ArrowUp') { S.cy = clamp(S.cy - paso, 0, GH - 1); e.preventDefault(); }
  else if (e.code === 'ArrowDown') { S.cy = clamp(S.cy + paso, 0, GH - 1); e.preventDefault(); }
  else if (e.code === 'Space') { S.vertiendo = !S.vertiendo; e.preventDefault(); anunciar(S.vertiendo ? X.t('vertiendo') : X.t('parado')); }
  else if (/^Digit[1-5]$/.test(e.code)) {
    const m = MATERIALES[Number(e.code.slice(5)) - 1] || 'borrar';
    if (m === 'borrar' || M.desbloqueados.indexOf(m) >= 0) { S.mat = m; interfaz(); }
  }
});
const lienzoFuera = document.createElement('canvas'); lienzoFuera.width = GW; lienzoFuera.height = GH;
const gf = lienzoFuera.getContext('2d'), imagen = gf.createImageData(GW, GH);
function draw() {
  const d = imagen.data;
  for (let i = 0; i < N; i++) {
    const t = cel[i], c = COLOR[t], o = i * 4, v = t === VACIO ? 0 : ((i * 2654435761) >>> 28) - 7;      // un poco de grano para que no se vea plano
    d[o] = clamp(c[0] + v, 0, 255); d[o + 1] = clamp(c[1] + v, 0, 255); d[o + 2] = clamp(c[2] + v, 0, 255); d[o + 3] = 255;
  }
  gf.putImageData(imagen, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(lienzoFuera, 0, 0, 640, 400);
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.5;
  g.strokeRect((S.cx - S.radio) * CELDA, (S.cy - S.radio) * CELDA, (S.radio * 2 + 1) * CELDA, (S.radio * 2 + 1) * CELDA);
}
let ultimo = 0, acc = 0;
function bucle(ts) {
  acc += Math.min(60, ts - (ultimo || ts)); ultimo = ts;
  const n = Math.floor(acc / MS_TICK); acc -= n * MS_TICK;
  if (S.vertiendo && !S.apretado) aplicarPincel();
  if (S.apretado) aplicarPincel();
  avanzarTicks(n);
  draw();
  requestAnimationFrame(bucle);
}
X.ui.muteButton($('tools')); X.ui.langButton($('tools')); X.ui.supportLink($('tools'));
restaurar();
X.onLang(textos); textos();
if (!BOT) requestAnimationFrame(bucle); else draw();

// ---- interfaz para pruebas y bots ------------------------------------------------------------------------------------------------------------
window.__arena = {
  estado: () => Object.assign({ tick, material: S.mat, desbloqueados: M.desbloqueados.slice(), descubiertos: M.descubiertos.slice(), aviso: S.aviso }, medidas()),
  poner: (m, x, y, r) => (M.desbloqueados.indexOf(m) >= 0 ? poner(m, x, y, r) : -1),
  avanzar: (ticks) => avanzarTicks(ticks),
};
if (X.bots) {
  X.bots.registrar({
    juego: (window.JUEGO && window.JUEGO.id) || 'arena', version: (window.JUEGO && window.JUEGO.version) || '',
    reiniciar(semilla) { reiniciarMundo(semilla); S.mat = 'arena'; return {}; },
    estado() {
      const m = medidas();
      return { tick, segundos: Math.round(tick / TICKS_S * 100) / 100, desbloqueados: M.desbloqueados.slice(), descubrimientos: M.descubiertos.slice(), conteos: m.conteos, colocadas: Object.assign({}, M.colocadas),
        altura_montana: m.montana, agua_columna: m.estanque, gelatina_sobre_agua: m.isla, ancho: GW, alto: GH, siguiente: DESCUBRIMIENTOS.find((d) => M.descubiertos.indexOf(d) < 0) || null };
    },
    acciones: () => [{ tipo: 'poner', material: M.desbloqueados.slice(), x: { min: 0, max: GW - 1 }, y: { min: 0, max: GH - 1 }, radio: { min: 1, max: 8 } },
      { tipo: 'borrar', x: { min: 0, max: GW - 1 }, y: { min: 0, max: GH - 1 }, radio: { min: 1, max: 8 } }, { tipo: 'esperar' }],
    actuar(a) {
      if (!a || (a.tipo !== 'poner' && a.tipo !== 'borrar')) return { valida: false, motivo: 'acción desconocida' };
      if (![a.x, a.y, a.radio].every(Number.isFinite)) return { valida: false, motivo: 'faltan x, y y radio' };
      const x = Math.round(a.x), y = Math.round(a.y), r = clamp(Math.round(a.radio), 1, 8);
      if (x < 0 || x >= GW || y < 0 || y >= GH) return { valida: false, motivo: 'fuera de la rejilla' };
      if (a.tipo === 'borrar') return { valida: true, borradas: borrar(x, y, r) };
      if (M.desbloqueados.indexOf(a.material) < 0) return { valida: false, motivo: 'material bloqueado o desconocido' };
      return { valida: true, colocadas: poner(a.material, x, y, r) };
    },
    avanzar: (ms) => avanzarTicks(Math.max(1, Math.round(ms / MS_TICK))),
    terminado: () => { const t = M.descubiertos.length === DESCUBRIMIENTOS.length; return { fin: t, exito: t, motivo: t ? 'todo-descubierto' : '' }; },
    puntaje: () => M.descubiertos.length,
    invariantes() {
      const v = [], m = medidas(), c = m.conteos, total = c.arena + c.agua + c.piedra + c.gelatina + c.barro;
      if (total !== M.colocadasTotal - M.borradas) v.push('la materia no se conserva: hay ' + total + ' celdas y se pusieron ' + (M.colocadasTotal - M.borradas));
      for (let i = 0; i < N; i++) if (cel[i] > BARRO) { v.push('una celda tiene un tipo que no existe'); break; }
      return v;
    },
    resumen: () => ({ descubrimientos: M.descubiertos.length, cuando: Object.assign({}, M.cuando), colocadas: M.colocadasTotal }),
  });
}
</script>
